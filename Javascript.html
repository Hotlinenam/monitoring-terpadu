function validateNumericInput(input) {
  var val = input.value;
  val = val.replace(/,/g, '.').replace(/[^0-9.]/g, '');
  var parts = val.split('.');
  if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
  if (parts.length === 2 && parts[1].length > 2) val = parts[0] + '.' + parts[1].substring(0, 2);
  input.value = val;
}

function getCurrentPosition() {
  return new Promise(function(resolve, reject) {
    if (!navigator.geolocation) { reject(new Error('Geolocation tidak didukung')); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, timestamp: new Date(pos.timestamp).toISOString() }); },
      function(err) { reject(new Error('Gagal mendapatkan lokasi: ' + err.message)); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  });
}

function getFormattedTimestamp() {
  var now = new Date(); var pad = function(n){ return String(n).padStart(2, '0'); };
  return now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}
function getFormattedDateForFilename() { var now = new Date(); var pad = function(n){ return String(n).padStart(2, '0'); }; return '' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()); }
function getFormattedTimeForFilename() { var now = new Date(); var pad = function(n){ return String(n).padStart(2, '0'); }; return '' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()); }

function previewAndPrepareImage(input, qid) {
  var preview = document.getElementById('flowPreview_' + qid);
  var actionBtn = document.getElementById('fileSubmitBtn_' + qid);
  if (!preview || !actionBtn) return;
  currentBase64Data = null;
  if (preview.dataset.bloburl) { URL.revokeObjectURL(preview.dataset.bloburl); preview.dataset.bloburl = ''; }
  preview.removeAttribute('src'); preview.style.display = 'none'; preview.classList.remove('show');
  if (!input.files || !input.files.length) { actionBtn.disabled = true; return; }
  var file = input.files[0];
  actionBtn.disabled = true;
  actionBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses Gambar HD...';
  var blobUrl = URL.createObjectURL(file);
  preview.dataset.bloburl = blobUrl;
  preview.src = blobUrl; preview.style.display = 'block'; preview.classList.add('show');
  var photoTimestamp = getFormattedTimestamp();
  var photoDateFile = getFormattedDateForFilename();
  var photoTimeFile = getFormattedTimeForFilename();
  getCurrentPosition()
    .then(function(loc){
      return getLocationNameWithCache(loc.lat, loc.lng).then(function(name){
        processImageWithMetadata(file, qid, preview, actionBtn, { timestamp: photoTimestamp, dateFile: photoDateFile, timeFile: photoTimeFile, lat: loc.lat, lng: loc.lng, accuracy: loc.accuracy, locationName: name, locationTimestamp: loc.timestamp });
      });
    })
    .catch(function(err){
      processImageWithMetadata(file, qid, preview, actionBtn, { timestamp: photoTimestamp, dateFile: photoDateFile, timeFile: photoTimeFile, lat: null, lng: null, accuracy: null, locationName: 'Lokasi tidak tersedia', locationError: err.message });
    });
}

function processImageWithMetadata(file, qid, preview, actionBtn, metadata) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX_SIZE = 1600;
      var width = img.width, height = img.height;
      if (width > height) { if (width > MAX_SIZE) { height = Math.round(height * MAX_SIZE / width); width = MAX_SIZE; } }
      else { if (height > MAX_SIZE) { width = Math.round(width * MAX_SIZE / height); height = MAX_SIZE; } }
      var canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      var ctx = canvas.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);
      ctx.save();
      var textLines = [];
      textLines.push('FOTO: ' + metadata.timestamp);
      if (metadata.locationName && metadata.locationName !== 'Lokasi tidak tersedia' && metadata.locationName !== 'Lokasi tidak diketahui') textLines.push('LOKASI: ' + metadata.locationName);
      if (metadata.lat !== null && metadata.lng !== null) {
        textLines.push('GPS: ' + metadata.lat.toFixed(6) + ', ' + metadata.lng.toFixed(6));
        if (metadata.accuracy) textLines.push('AKURASI: +/- ' + Math.round(metadata.accuracy) + 'm');
      } else textLines.push('LOKASI: Tidak tersedia');
      var fontSize = Math.max(14, Math.min(20, width / 55));
      ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      var lineHeight = fontSize * 1.4, padding = 8;
      var totalHeight = (textLines.length * lineHeight) + (padding * 2);
      var maxW = 0;
      for (var i = 0; i < textLines.length; i++) { var m = ctx.measureText(textLines[i]); if (m.width > maxW) maxW = m.width; }
      var bgW = maxW + (padding * 2), bgX = 10, bgY = height - totalHeight - 10;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      if (typeof ctx.roundRect === 'function') ctx.roundRect(bgX, bgY, bgW, totalHeight, 6); else ctx.rect(bgX, bgY, bgW, totalHeight);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      for (var j = 0; j < textLines.length; j++) { var y = bgY + padding + (j * lineHeight) + fontSize; ctx.fillText(textLines[j], bgX + padding, y); }
      ctx.restore();
      var quality = 0.65;
      var base64Result = canvas.toDataURL('image/jpeg', quality);
      var cleanQid = String(qid).toLowerCase().trim();
      var fileMapping = {
        uploadpylon: 'foto_pylon', uploaddocpylon: 'dokumen_pylon', uploadsignage: 'foto_signage',
        uploaddocsignage: 'dokumen_signage', uploadfotobagianluar: 'foto_luar', qfotolingkungan: 'foto_lingkungan',
        fotodinding: 'foto_dinding', fotolantai: 'foto_lantai', fotoplafon: 'foto_plafon',
        quploadfotosuhu: 'foto_suhu', quploadfototegangan: 'foto_tegangan', quploadfotogrounding: 'foto_grounding',
        uploadfotoboxit: 'foto_box_it', qfotomesin: 'foto_mesin', qfotoskimming: 'foto_skimming',
        qfotopalsu: 'foto_palsu', qfotobrosur: 'foto_brosur'
      };
      var dbCol = fileMapping[cleanQid] || 'foto_lampiran';
      var columnName = dbCol.toUpperCase();
      var dateStr = metadata.dateFile, timeStr = metadata.timeFile;
      var uniqueCode = Math.random().toString(36).substring(2, 7);
      var filename = columnName + '_' + dateStr + '_' + timeStr + '_' + uniqueCode + '.jpg';
      currentBase64Data = {
        data: base64Result, filename: filename, dbCol: dbCol, mimeType: 'image/jpeg',
        metadata: { timestamp: metadata.timestamp, timestampFile: dateStr + '_' + timeStr, latitude: metadata.lat, longitude: metadata.lng, accuracy: metadata.accuracy, locationName: metadata.locationName || 'Lokasi tidak diketahui', locationTimestamp: metadata.locationTimestamp }
      };
      actionBtn.disabled = false;
      actionBtn.innerHTML = '<i class="fas fa-upload me-1"></i> Lanjut';
      var info = document.getElementById('locationInfo_' + qid); if (info) info.remove();
      var newInfo = document.createElement('div');
      newInfo.id = 'locationInfo_' + qid;
      newInfo.style.cssText = 'font-size:0.75rem;color:#555;text-align:left;margin-top:5px;padding:6px 10px;background:#f8f9fa;border-radius:6px;border:1px solid #e9ecef;width:100%;';
      var infoHTML = '<b>Status Kompresi:</b> Optimal (~100KB)<br>Waktu: ' + metadata.timestamp + '<br>';
      if (metadata.locationName && metadata.locationName !== 'Lokasi tidak diketahui' && metadata.locationName !== 'Lokasi tidak tersedia') infoHTML += 'Lokasi: ' + metadata.locationName + '<br>';
      if (metadata.lat !== null && metadata.lng !== null) {
        infoHTML += 'GPS: ' + metadata.lat.toFixed(6) + ', ' + metadata.lng.toFixed(6);
        if (metadata.accuracy) infoHTML += ' (+/-' + Math.round(metadata.accuracy) + 'm)';
      }
      newInfo.innerHTML = infoHTML;
      preview.parentNode.insertBefore(newInfo, preview.nextSibling);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.width = 0; canvas.height = 0;
      img.onload = null; img.src = '';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function flowFileAnswer(qid, retryCount) {
  if (!currentBase64Data || !currentBase64Data.data) { showToast('warning', '⚠️ Foto belum selesai diproses.'); return; }
  retryCount = retryCount || 0;
  var overlay = document.getElementById('loadingOverlay');
  var loadingText = document.getElementById('loadingText');
  if (overlay) overlay.classList.add('show');
  if (loadingText) loadingText.textContent = 'Mengunggah foto HD ke server Drive...';
  var tmp = currentBase64Data; currentBase64Data = null;
  var fileItem = { data: tmp.data, mimeType: tmp.mimeType };
  var fileName = tmp.filename;
  var dbCol = tmp.dbCol;
  if (tmp.metadata) {
    flowAnswers['meta_' + dbCol + '_timestamp'] = tmp.metadata.timestamp;
    flowAnswers['meta_' + dbCol + '_latitude'] = tmp.metadata.latitude;
    flowAnswers['meta_' + dbCol + '_longitude'] = tmp.metadata.longitude;
    flowAnswers['meta_' + dbCol + '_accuracy'] = tmp.metadata.accuracy;
    flowAnswers['meta_' + dbCol + '_location_name'] = tmp.metadata.locationName || 'Lokasi tidak diketahui';
  }
  var uploadBtn = document.getElementById('fileSubmitBtn_' + qid);
  if (uploadBtn) uploadBtn.disabled = true;
  var timeoutId = setTimeout(function(){
    if (overlay) overlay.classList.remove('show');
    showToast('danger', '⚠️ Upload terlalu lama.');
  }, 30000);
  google.script.run
    .withSuccessHandler(function(res) {
      clearTimeout(timeoutId);
      if (overlay) overlay.classList.remove('show');
      uploadedFileNames[dbCol] = fileName;
      flowAnswers[qid] = fileName;
      if (flowHistory[flowHistory.length - 1] !== qid) flowHistory.push(qid);
      var preview = document.getElementById('flowPreview_' + qid);
      if (preview) { if (preview.src && preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src); preview.src = ''; preview.classList.remove('show'); }
      var input = document.getElementById('flowFileInput_' + qid); if (input) input.value = '';
      var info = document.getElementById('locationInfo_' + qid); if (info) info.remove();
      if (uploadBtn) { uploadBtn.disabled = true; uploadBtn.innerHTML = '<i class="fas fa-check me-1"></i> Upload Berhasil'; }
      showToast('success', 'Foto HD berhasil diupload.');
      setTimeout(function(){ determineNext(qid, fileName); }, 300);
    })
    .withFailureHandler(function(err) {
      clearTimeout(timeoutId);
      if (retryCount < 2) {
        showToast('warning', 'Mengulangi upload foto HD...');
        setTimeout(function(){ currentBase64Data = tmp; flowFileAnswer(qid, retryCount + 1); }, 1000);
        return;
      }
      if (overlay) overlay.classList.remove('show');
      if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.innerHTML = '<i class="fas fa-upload me-1"></i> Lanjut'; }
      showToast('danger', 'Upload gagal. Silakan coba lagi.');
    })
    .uploadSingleFile(fileItem, fileName);
}

function getLocationName(lat, lng) {
  return new Promise(function(resolve) {
    if (!lat || !lng) { resolve('Lokasi tidak tersedia'); return; }
    var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&addressdetails=1';
    fetch(url, { headers: { 'User-Agent': 'SurveyApp/1.0' } })
      .then(function(r){ if (!r.ok) throw new Error('Gagal'); return r.json(); })
      .then(function(data){
        if (data && data.display_name) {
          var a = data.address || {}; var parts = [];
          ['building','amenity','shop','road','suburb','village','town','city','state'].forEach(function(k){ if (a[k]) parts.push(a[k]); });
          var name = parts.length > 0 ? parts.join(', ') : data.display_name;
          if (name.length > 100) name = name.substring(0, 100) + '...';
          resolve(name);
        } else resolve('Lokasi tidak diketahui');
      })
      .catch(function(){ resolve('Lokasi tidak diketahui'); });
  });
}

function getLocationNameWithCache(lat, lng) {
  var key = lat.toFixed(6) + ',' + lng.toFixed(6);
  if (locationCache[key]) return Promise.resolve(locationCache[key]);
  return getLocationName(lat, lng).then(function(name){ locationCache[key] = name; return name; });
}

// ====================================================================
var photoZoomState = {
  scale: 1, minScale: 1, maxScale: 8,
  translateX: 0, translateY: 0,
  isDragging: false, dragStartX: 0, dragStartY: 0,
  startTranslateX: 0, startTranslateY: 0,
  pinchStartDist: 0, pinchStartScale: 1, lastTapTime: 0
};
var ZOOM_STEP = 0.25;

function updatePhotoTransform() {
  var img = document.getElementById('photoPreviewImg');
  var label = document.getElementById('zoomLevelLabel');
  if (!img) return;
  img.style.transform = 'translate(' + photoZoomState.translateX + 'px, ' + photoZoomState.translateY + 'px) scale(' + photoZoomState.scale + ')';
  if (label) label.textContent = Math.round(photoZoomState.scale * 100) + '%';
}
function zoomInPhoto() { photoZoomState.scale = Math.min(photoZoomState.scale + ZOOM_STEP, photoZoomState.maxScale); updatePhotoTransform(); }
function zoomOutPhoto() { photoZoomState.scale = Math.max(photoZoomState.scale - ZOOM_STEP, photoZoomState.minScale); if (photoZoomState.scale === 1) { photoZoomState.translateX = 0; photoZoomState.translateY = 0; } updatePhotoTransform(); }
function resetZoomPhoto() { photoZoomState.scale = 1; photoZoomState.translateX = 0; photoZoomState.translateY = 0; updatePhotoTransform(); }
function toggleFullscreenPhoto() {
  var container = document.getElementById('photoZoomContainer'); var btn = document.getElementById('fsToggleBtn');
  if (!container) return;
  if (!document.fullscreenElement) {
    if (container.requestFullscreen) container.requestFullscreen();
    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    else if (container.msRequestFullscreen) container.msRequestFullscreen();
    if (btn) btn.innerHTML = '<i class="fas fa-compress"></i>';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    if (btn) btn.innerHTML = '<i class="fas fa-expand"></i>';
  }
}
function initPhotoZoomEvents() {
  var container = document.getElementById('photoZoomContainer');
  if (!container) return;
  if (container.dataset.zoomBound === '1') return;
  container.dataset.zoomBound = '1';
  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    photoZoomState.scale = Math.min(Math.max(photoZoomState.scale + delta, photoZoomState.minScale), photoZoomState.maxScale);
    if (photoZoomState.scale === 1) { photoZoomState.translateX = 0; photoZoomState.translateY = 0; }
    updatePhotoTransform();
  }, { passive: false });
  container.addEventListener('mousedown', function(e) {
    if (photoZoomState.scale <= 1) return;
    e.preventDefault();
    photoZoomState.isDragging = true; photoZoomState.dragStartX = e.clientX; photoZoomState.dragStartY = e.clientY;
    photoZoomState.startTranslateX = photoZoomState.translateX; photoZoomState.startTranslateY = photoZoomState.translateY;
    container.classList.add('dragging');
  });
  document.addEventListener('mousemove', function(e) {
    if (!photoZoomState.isDragging) return;
    photoZoomState.translateX = photoZoomState.startTranslateX + (e.clientX - photoZoomState.dragStartX);
    photoZoomState.translateY = photoZoomState.startTranslateY + (e.clientY - photoZoomState.dragStartY);
    updatePhotoTransform();
  });
  document.addEventListener('mouseup', function() {
    if (photoZoomState.isDragging) { photoZoomState.isDragging = false; container.classList.remove('dragging'); }
  });
  container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      photoZoomState.pinchStartDist = Math.sqrt(dx*dx + dy*dy);
      photoZoomState.pinchStartScale = photoZoomState.scale;
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - photoZoomState.lastTapTime < 300) {
        e.preventDefault();
        if (photoZoomState.scale > 1) resetZoomPhoto();
        else { photoZoomState.scale = 2; updatePhotoTransform(); }
        photoZoomState.lastTapTime = 0; return;
      }
      photoZoomState.lastTapTime = now;
      if (photoZoomState.scale > 1) {
        photoZoomState.isDragging = true;
        photoZoomState.dragStartX = e.touches[0].clientX; photoZoomState.dragStartY = e.touches[0].clientY;
        photoZoomState.startTranslateX = photoZoomState.translateX; photoZoomState.startTranslateY = photoZoomState.translateY;
      }
    }
  }, { passive: false });
  container.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (photoZoomState.pinchStartDist > 0) {
        var ratio = dist / photoZoomState.pinchStartDist;
        photoZoomState.scale = Math.min(Math.max(photoZoomState.pinchStartScale * ratio, photoZoomState.minScale), photoZoomState.maxScale);
        updatePhotoTransform();
      }
    } else if (e.touches.length === 1 && photoZoomState.isDragging) {
      e.preventDefault();
      photoZoomState.translateX = photoZoomState.startTranslateX + (e.touches[0].clientX - photoZoomState.dragStartX);
      photoZoomState.translateY = photoZoomState.startTranslateY + (e.touches[0].clientY - photoZoomState.dragStartY);
      updatePhotoTransform();
    }
  }, { passive: false });
  container.addEventListener('touchend', function(e) {
    if (e.touches.length === 0) { photoZoomState.isDragging = false; photoZoomState.pinchStartDist = 0; }
    else if (e.touches.length === 1) {
      photoZoomState.pinchStartDist = 0;
      photoZoomState.isDragging = true;
      photoZoomState.dragStartX = e.touches[0].clientX; photoZoomState.dragStartY = e.touches[0].clientY;
      photoZoomState.startTranslateX = photoZoomState.translateX; photoZoomState.startTranslateY = photoZoomState.translateY;
    }
  });
  var modalEl = document.getElementById('photoPreviewModal');
  if (modalEl) {
    modalEl.addEventListener('hidden.bs.modal', function() {
      resetZoomPhoto();
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
      var btn = document.getElementById('fsToggleBtn');
      if (btn) btn.innerHTML = '<i class="fas fa-expand"></i>';
    });
  }
}

function setupDistribusiCardClick() {

    'distFree': 'Free'
  };

    if (card) {
      card.style.cursor = 'pointer';

function renderViewData(res) {
  if (!res || res.error) {
    var container = document.getElementById("viewTable");
    if (container) container.innerHTML = '<div class="error-msg">' + escapeHtml(res?.error || 'Koneksi database bermasalah') + '</div>';
    return;
  }
  if (res.summary) {
    var elTerminals = document.getElementById("viewTotalTerminals");
    var elNominal = document.getElementById("viewTotalNominal");
    if (elTerminals) elTerminals.innerText = res.summary.totalTerminals || 0;
    if (elNominal) elNominal.innerText = formatRupiah(res.summary.totalNominal || 0);
  }
  var allHeadersLocal = res.headers || [];
  var rows = res.rows || [];
  var userType = sewaLoginData ? sewaLoginData.type : 'HO';
  var columnOrder = {
    'BO': ['No', 'Timestamp', 'Terminal ID', 'Nama Lokasi', 'Jenis Mesin', 'Jenis Lokasi', 'Status Sewa', 'Kategori Lokasi', 'Keterangan Kerjasama', 'Harga Sewa Sebelumnya', 'Harga Sewa Terbaru', 'Kenaikan', 'Periode Bulan', 'Periode Tahun', 'Jumlah Pembayaran', 'Mekanisme Pembayaran', 'Tanggal Awal', 'Tanggal Berakhir', 'Status Perpanjangan', 'Keterangan'],
    'RO': ['No', 'Timestamp', 'KC Supervisi', 'Terminal ID', 'Nama Lokasi', 'Jenis Mesin', 'Jenis Lokasi', 'Status Sewa', 'Kategori Lokasi', 'Keterangan Kerjasama', 'Harga Sewa Sebelumnya', 'Harga Sewa Terbaru', 'Kenaikan', 'Periode Bulan', 'Periode Tahun', 'Jumlah Pembayaran', 'Mekanisme Pembayaran', 'Tanggal Awal', 'Tanggal Berakhir', 'Status Perpanjangan', 'Keterangan'],
    'HO': ['No', 'Timestamp', 'Regional Office', 'KC Supervisi', 'Terminal ID', 'Nama Lokasi', 'Jenis Mesin', 'Jenis Lokasi', 'Status Sewa', 'Kategori Lokasi', 'Keterangan Kerjasama', 'Harga Sewa Sebelumnya', 'Harga Sewa Terbaru', 'Kenaikan', 'Periode Bulan', 'Periode Tahun', 'Jumlah Pembayaran', 'Mekanisme Pembayaran', 'Tanggal Awal', 'Tanggal Berakhir', 'Status Perpanjangan', 'Keterangan']
  };
  var desiredOrder = columnOrder[userType] || columnOrder['HO'];
  var filteredHeaders = [];
  desiredOrder.forEach(function(desiredHeader) {
    for (var i = 0; i < allHeadersLocal.length; i++) {
      if (String(allHeadersLocal[i]).toLowerCase().trim() === String(desiredHeader).toLowerCase().trim()) {
        filteredHeaders.push(allHeadersLocal[i]);
        break;
      }
    }
  });
  if (filteredHeaders.length === 0) filteredHeaders = allHeadersLocal.slice();
  var reorderedRows = rows.map(function(row) {
    var newRow = [];
    filteredHeaders.forEach(function(h) {
      var idx = -1;
      for (var i = 0; i < allHeadersLocal.length; i++) {
        if (String(allHeadersLocal[i]).toLowerCase().trim() === String(h).toLowerCase().trim()) { idx = i; break; }
      }
      newRow.push((idx !== -1 && idx < row.length) ? row[idx] : "");
    });
    return newRow;
  });
  if (reorderedRows.length === 0) {
    var container = document.getElementById("viewTable");
    if (container) container.innerHTML = '<div style="text-align:center; padding:3rem; color:#64748b;"><div style="font-size:3rem; margin-bottom:1rem;">📭</div><h3 style="color:#0f172a;">Tidak Ada Data</h3><p>Tidak ditemukan data yang sesuai dengan filter yang dipilih.</p></div>';
    return;
  }
  var html = '<table><thead><tr>';
  filteredHeaders.forEach(function(h) { html += '<th>' + escapeHtml(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  reorderedRows.forEach(function(row, idx) {
    html += '<tr>';
    filteredHeaders.forEach(function(h, colIdx) {
      var val = (String(h).toLowerCase() === 'no') ? (idx + 1) : formatCell(h, row[colIdx]);
      var align = (['harga sewa sebelumnya','harga sewa terbaru','jumlah pembayaran','kenaikan'].indexOf(String(h).toLowerCase()) !== -1) ? 'right-align' : 'center-align';
      html += '<td class="' + align + '">' + escapeHtml(val) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  var infoHtml = '<div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; background: #f8fafc; border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.85rem; color: #475569;">';
  infoHtml += '<span>📊 Menampilkan <strong>' + reorderedRows.length + '</strong> data</span>';
  infoHtml += '<span>👤 Role: <strong>' + userType + '</strong> | 🔍 Filter: ' + (document.getElementById('viewFilterJatuhTempo')?.value || 'Semua') + '</span>';
  infoHtml += '</div>';
  var container = document.getElementById("viewTable");
  if (container) container.innerHTML = infoHtml + html;
}

function populateKerjasamaDynamicFilters() {
  if (!cachedKerjasamaData || !cachedKerjasamaData.headers || !cachedKerjasamaData.rawRows) return;
  var headers = cachedKerjasamaData.headers;
  var rows = cachedKerjasamaData.rawRows;
  var regionalIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "regional office"; });
  var kcIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "kc supervisi"; });
  if (regionalIdx !== -1) {
    var regionals = [...new Set(rows.map(function(r) { return r[regionalIdx]; }).filter(Boolean))].sort();
    var regSelect = document.getElementById("kerjasamaFilterRegional");
    if (regSelect) {
      var currentVal = regSelect.value;
      regSelect.innerHTML = '<option value="Semua">Semua</option>';
      regionals.forEach(function(r) { regSelect.innerHTML += '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + '</option>'; });
      regSelect.value = regionals.includes(currentVal) ? currentVal : "Semua";
    }
  }
  if (kcIdx !== -1) {
    var kcs = [...new Set(rows.map(function(r) { return r[kcIdx]; }).filter(Boolean))].sort();
    var kcSelect = document.getElementById("kerjasamaFilterKC");
    if (kcSelect) {
      var currentVal = kcSelect.value;
      kcSelect.innerHTML = '<option value="Semua">Semua</option>';
      kcs.forEach(function(k) { kcSelect.innerHTML += '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>'; });
      kcSelect.value = kcs.includes(currentVal) ? currentVal : "Semua";
    }
  }
}

function applyKerjasamaLocalFilter() {
  if (!cachedKerjasamaData || !cachedKerjasamaData.rawRows) return;
  var fKerjasama = document.getElementById("kerjasamaFilterKerjasama")?.value.trim().toLowerCase() || "semua";
  var fRegional = document.getElementById("kerjasamaFilterRegional")?.value.trim().toLowerCase() || "semua";
  var fKC = document.getElementById("kerjasamaFilterKC")?.value.trim().toLowerCase() || "semua";
  var originalRows = cachedKerjasamaData.rawRows || [];
  var headers = cachedKerjasamaData.headers || [];
  var kerjasamaIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "kerjasama"; });
  var regionalIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "regional office"; });
  var kcIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "kc supervisi"; });
  var terminalIdIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "terminal id"; });
  var jumlahPembayaranIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "jumlah pembayaran"; });
  var filteredRows = originalRows.filter(function(row) {
    var valKerjasama = kerjasamaIdx !== -1 ? String(row[kerjasamaIdx] || '').trim().toLowerCase() : '';
    var valRegional = regionalIdx !== -1 ? String(row[regionalIdx] || '').trim().toLowerCase() : '';
    var valKC = kcIdx !== -1 ? String(row[kcIdx] || '').trim().toLowerCase() : '';
    var matchKerjasama = (fKerjasama === "semua") ? (valKerjasama !== "") : (valKerjasama === fKerjasama);
    var matchRegional = (fRegional === "semua" || valRegional === fRegional);
    var matchKC = (fKC === "semua" || valKC === fKC);
    return matchKerjasama && matchRegional && matchKC;
  });
  var totalNominal = 0;
  var uniqueTerminals = new Set();
  filteredRows.forEach(function(row) {
    if (terminalIdIdx !== -1 && row[terminalIdIdx]) uniqueTerminals.add(String(row[terminalIdIdx]).trim());
    if (jumlahPembayaranIdx !== -1 && row[jumlahPembayaranIdx]) {
      var nominal = parseFloat(String(row[jumlahPembayaranIdx]).replace(/[^0-9.-]/g, ''));
      if (!isNaN(nominal)) totalNominal += nominal;
    }
  });
  var displayRows = filteredRows.map(function(r, idx) {
    var displayArr = [...r];
    displayArr[0] = idx + 1;
    var terminalId = terminalIdIdx !== -1 ? String(r[terminalIdIdx] || '').trim() : '';
    displayArr[1] = '<button class="edit-btn-kerjasama" data-terminal="' + escapeHtml(terminalId) + '">✏️ Edit</button>';
    return displayArr;
  });
  renderKerjasamaData({
    headers: headers,
    rows: displayRows,
    summary: { totalTerminals: uniqueTerminals.size, totalNominal: totalNominal },
    isIndomaret: false
  });
}

function renderKerjasamaData(res) {
  if (!res || res.error) {
    var container = document.getElementById("kerjasamaTable");
    if (container) container.innerHTML = '<div class="error-msg">' + escapeHtml(res?.error || 'Koneksi database bermasalah') + '</div>';
    return;
  }
  if (res.summary) {
    var elTerminals = document.getElementById("kerjasamaTotalTerminals");
    var elNominal = document.getElementById("kerjasamaTotalNominal");
    if (elTerminals) elTerminals.innerText = res.summary.totalTerminals || 0;
    if (elNominal) elNominal.innerText = formatRupiah(res.summary.totalNominal || 0);
  }
  var headers = res.headers || [];
  var rows = res.rows || [];
  var updateButtonHtml = '';
  var filterKerjasama = document.getElementById("kerjasamaFilterKerjasama")?.value || "Semua";
  var isHO = sewaLoginData && sewaLoginData.type === "HO";

  if (filterKerjasama === "Indomaret") {
    if (isHO) {
      updateButtonHtml = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem; flex-wrap:wrap;"><button id="updateIndomaretBtn" onclick="updateIndomaretData()" style="background:#16a34a; color:white; border:none; padding:0.6rem 1.5rem; border-radius:8px; font-weight:600; cursor:pointer;">🔄 Update Semua Data Indomaret</button></div>';
    } else {
      updateButtonHtml = '<div style="margin-bottom:1rem;"><span style="background:#fef3c7; padding:0.25rem 0.75rem; border-radius:12px; font-size:0.75rem; color:#92400e;">🔍 Filter: Indomaret (🔒 Hanya HO)</span></div>';
    }
  }

  if (rows.length === 0) {
    var container = document.getElementById("kerjasamaTable");
    if (container) container.innerHTML = updateButtonHtml + '<div style="text-align:center; padding:3rem; color:#64748b;"><div style="font-size:3rem; margin-bottom:1rem;">📭</div><h3 style="color:#0f172a;">Tidak Ada Data</h3><p>Tidak ditemukan data kerjasama yang sesuai dengan filter.</p></div>';
    return;
  }

  var html = '<table><thead><tr>';
  headers.forEach(function(h) { html += '<th>' + (String(h).toLowerCase() === 'action' ? 'Aksi' : escapeHtml(h)) + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function(row, idx) {
    html += '<tr>';
    headers.forEach(function(h, colIdx) {
      var rawVal = row[colIdx];
      var hLower = String(h).toLowerCase();
      if (hLower === 'action') {
        html += '<td class="center-align">' + rawVal + '</td>';
      } else {
        var val = (hLower === 'no') ? (idx + 1) : formatCell(h, rawVal);
        var align = (['harga sewa sebelumnya', 'harga sewa terbaru', 'jumlah pembayaran', 'kenaikan'].indexOf(hLower) !== -1) ? 'right-align' : 'center-align';
        html += '<td class="' + align + '">' + escapeHtml(val) + '</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  var infoHtml = '<div style="padding:0.5rem 1rem; background:#f8fafc; border-radius:8px; margin-bottom:0.5rem; font-size:0.85rem; color:#475569;"><span>📊 Menampilkan <strong>' + rows.length + '</strong> data kerjasama</span></div>';
  var container = document.getElementById("kerjasamaTable");
  if (container) container.innerHTML = updateButtonHtml + infoHtml + html;
}

function closeKerjasamaEditForm() {
  var editContainer = document.getElementById("kerjasamaEditContainer");
  if (editContainer) editContainer.style.display = "none";
  var filterSummary = document.getElementById("kerjasamaFilterSummarySection");

function updateIndomaretData() {
  if (!sewaLoginData) { showAlert("Silakan login terlebih dahulu", "Error", "❌"); return; }
  if (sewaLoginData.type !== 'HO') { showAlert("Hanya Head Office yang dapat melakukan update massal Indomaret.", "Akses Ditolak", "🔒"); return; }
  var currentYear = new Date().getFullYear();
  var messageHtml = '<div><div style="background:#fef2f2; border-left:4px solid #dc2626; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem;"><strong style="color:#dc2626;">⚠️ KONFIRMASI UPDATE MASSAL</strong><p style="margin:0.25rem 0 0 0; color:#7f1d1d;">Sistem akan memperbarui seluruh baris dengan Kerjasama = "Indomaret".</p></div><div style="background:#f8fafc; border-radius:10px; padding:0.5rem 0.75rem; border:1px solid #e2e8f0;"><ul style="margin:5px 0 0 20px; font-size:0.85rem; color:#475569;"><li>Jenis Lokasi: <b>OFFSITE</b></li><li>Status Sewa: <b>SW 2 - Perpanjangan</b></li><li>Harga: <b>Rp 18.000.000</b> (12 Bulan)</li><li>Tanggal: <b>01/01/' + currentYear + ' s/d 31/12/' + currentYear + '</b></li></ul></div></div>';
  showConfirm(messageHtml, "Update Massal Indomaret", "⚠️", true, true).then(function(confirmed) {
    if (!confirmed) return;
    showFullLoader();
    google.script.run
      .withSuccessHandler(function(response) {
        hideFullLoader();
        showOperationResult(response, "✅ Update Massal Berhasil", "✅");

          invalidateAllDataCaches();
          loadKerjasamaData(true);

        hideFullLoader();

function searchDataForExtend() {

  var msgDiv = document.getElementById("extendMsg");
  var detailDiv = document.getElementById("extendDetailForm");
  var searchBtn = document.getElementById("searchBtn");
  if (msgDiv) { msgDiv.style.display = "none"; msgDiv.className = ""; msgDiv.innerHTML = ""; }

    detailDiv.innerHTML = '<div style="text-align:center; padding:2rem;"><div class="loading-spinner"></div><p>Mencari data...</p></div>';
    detailDiv.style.display = "block";
  }

function buildExtendFullForm(data) {
  function formatNumStr(v) { if (!v) return ""; var n = String(v).replace(/[^0-9]/g, ''); return n === "" ? "" : parseInt(n).toLocaleString('id-ID'); }
  function formatDateStr(d) { if (!d) return ""; if (d instanceof Date) return d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getFullYear(); if (typeof d === 'string' && d.split('/').length === 3) return d; return ""; }

    if (!start || !period) return "";

    if (parts.length !== 3) return "";
    var endDate = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1 + parseInt(period), parseInt(parts[0]));
    endDate.setDate(endDate.getDate() - 1);

function submitExtendFullData() {
  var submitBtn = document.getElementById("submitExtendBtn");
  var namaLokasi = document.getElementById("extend_nama_lokasi")?.value?.trim();
  if (!namaLokasi) { showAlert("Nama Lokasi wajib diisi", "Validasi Gagal", "⚠️"); return; }
  var regional = document.getElementById("extend_regional")?.value?.trim() || "";
  var kc = document.getElementById("extend_kc")?.value?.trim() || "";
  var kategoriEl = document.getElementById("extend_kategori_lokasi");
  var jenisKerjasamaEl = document.getElementById("extend_jenis_kerjasama");
  var kerjasamaLainEl = document.getElementById("extend_keterangan_kerjasama_lain");
  var kategori = kategoriEl?.value || "";
  var keteranganKerjasama = "";
  var isFree = kategori === "Free";
  if (kategori === "Kerjasama") {
    if (!jenisKerjasamaEl || !jenisKerjasamaEl.value) { showAlert("Pilih Jenis Kerjasama", "Validasi Gagal", "⚠️"); return; }
    if (jenisKerjasamaEl.value === "Alfamart") keteranganKerjasama = "Alfamart";
    else if (jenisKerjasamaEl.value === "Pegadaian") keteranganKerjasama = "Pegadaian";
    else if (jenisKerjasamaEl.value === "Instansi") {
      var namaInstansi = document.getElementById("extend_nama_instansi")?.value?.trim();
      if (!namaInstansi) { showAlert("Isi Nama Instansi", "Validasi Gagal", "⚠️"); return; }
      keteranganKerjasama = "Instansi - " + namaInstansi;
    } else if (jenisKerjasamaEl.value === "Lainnya") {
      keteranganKerjasama = kerjasamaLainEl?.value?.trim() || "";
      if (!keteranganKerjasama) { showAlert("Isi Keterangan Kerjasama", "Validasi Gagal", "⚠️"); return; }
    }
  }
  var hargaSebelumnya = document.getElementById("extend_harga_sebelumnya")?.value || "";
  var hargaTerbaru = document.getElementById("extend_harga_terbaru")?.value || "";
  var periodeBulan = document.getElementById("extend_periode_bulan")?.value || "";
  var mekanisme = document.getElementById("extend_mekanisme_pembayaran")?.value || "";
  var tanggalAwal = document.getElementById("extend_tanggal_awal")?.value || "";
  var tanggalBerakhir = document.getElementById("extend_tanggal_berakhir")?.value || "";
  var keterangan = document.getElementById("extend_keterangan")?.value || "";
  var hargaTerbaruNum = parseNumberFromFormat(hargaTerbaru);
  if (!isFree && (!hargaTerbaruNum || parseInt(hargaTerbaruNum) <= 0)) { showAlert("Harga Sewa Terbaru wajib diisi", "Validasi Gagal", "⚠️"); return; }
  if (!isFree && tanggalBerakhir) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var endDate = parseFrontendDate(tanggalBerakhir);
    if (endDate && endDate < today) { showAlert("Tanggal berakhir sudah expired.", "Validasi Gagal", "⚠️"); return; }
  }
  if (isFree) { hargaSebelumnya = "0"; hargaTerbaru = "0"; periodeBulan = "0"; mekanisme = ""; tanggalAwal = ""; tanggalBerakhir = ""; }
  var updatedData = {
    "Regional Office": regional, "KC Supervisi": kc, "Nama Lokasi": namaLokasi,
    "Jenis Mesin": document.getElementById("extend_jenis_mesin")?.value || "",
    "Status Sewa": document.getElementById("extend_status_sewa")?.value || "",
    "Kategori Lokasi": kategori, "Keterangan Kerjasama": keteranganKerjasama,
    "Harga Sewa Sebelumnya": parseNumberFromFormat(hargaSebelumnya),
    "Harga Sewa Terbaru": parseNumberFromFormat(hargaTerbaru),
    "Periode Bulan": parseNumberFromFormat(periodeBulan),
    "Mekanisme Pembayaran": mekanisme, "Tanggal Awal": tanggalAwal,
    "Tanggal Berakhir": tanggalBerakhir, "Keterangan": keterangan,
    "Terminal ID": document.getElementById("extend_terminal_id")?.value || ""
  };
  submitBtn.innerHTML = "Menyimpan..."; submitBtn.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {
      submitBtn.innerText = "💾 Simpan Perpanjangan"; submitBtn.disabled = false;
      if (res.success) {
        showOperationResult(res, "✅ Data Berhasil Diperpanjang", "✅");
        invalidateAllDataCaches(); loadManagementData();
        if (lastActiveTab === 'dashboard') loadDataWithFilters(true);
        var detailDiv = document.getElementById("extendDetailForm");
        if (detailDiv) { detailDiv.style.display = "none"; detailDiv.innerHTML = ""; }
        var searchInput = document.getElementById("searchTerminalId");
        if (searchInput) searchInput.value = "";
        currentExtendRowIndex = null; currentExtendTerminalId = null;
      } else showAlert(res.message, "Gagal", "❌");
    })
    .withFailureHandler(function(err) {
      submitBtn.innerText = "💾 Simpan Perpanjangan"; submitBtn.disabled = false;
      showAlert("Error: " + err.message, "Error Server", "❌");
    })
    .updatePerpanjanganData(sewaLoginData, currentExtendRowIndex, updatedData);
}

function searchDataForEdit() {
  var terminalId = document.getElementById("editSearchTerminalId")?.value?.trim();
  var msgDiv = document.getElementById("editMsg");
  var detailDiv = document.getElementById("editDetailForm");
  var searchBtn = document.getElementById("editSearchBtn");
  if (msgDiv) { msgDiv.style.display = "none"; msgDiv.className = ""; msgDiv.innerHTML = ""; }
  if (detailDiv) detailDiv.style.display = "none";
  if (!terminalId) { showAlert("Masukkan Terminal ID", "Peringatan", "⚠️"); return; }
  var originalBtnText = searchBtn.innerText;
  searchBtn.innerHTML = "Memuat..."; searchBtn.disabled = true;
  if (detailDiv) {
    detailDiv.innerHTML = '<div style="text-align:center; padding:2rem;"><div class="loading-spinner"></div><p>Mencari data...</p></div>';
    detailDiv.style.display = "block";
  }
  google.script.run
    .withSuccessHandler(function(res) {
      searchBtn.innerText = "🔍 Cari Data"; searchBtn.disabled = false;

        if (msgDiv) { msgDiv.style.display = "block"; msgDiv.className = "error-msg"; msgDiv.innerHTML = "❌ " + escapeHtml(res.message); }

      if (detailDiv) detailDiv.style.display = "none";
    })
    .getDataByTerminalId(sewaLoginData, terminalId);
}

function buildEditFullForm(data) {
  if (!data) { showAlert("Data tidak ditemukan", "Error", "❌"); return; }
  function formatNumStr(v) { if (v === null || v === undefined || v === "") return ""; var n = String(v).replace(/[^0-9]/g, ""); return n === "" ? "" : parseInt(n, 10).toLocaleString("id-ID"); }
  function formatDateStr(d) {
    if (!d) return "";
    if (d instanceof Date) return d.getDate().toString().padStart(2, "0") + "/" + (d.getMonth() + 1).toString().padStart(2, "0") + "/" + d.getFullYear();
    var str = String(d).trim();
    if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) { var p = str.split("/"); return p[0].padStart(2, "0") + "/" + p[1].padStart(2, "0") + "/" + p[2]; }
    if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(str)) { var p2 = str.split("-"); return p2[2].padStart(2, "0") + "/" + p2[1].padStart(2, "0") + "/" + p2[0]; }
    return "";

  var kerjasamaValue = data["Keterangan Kerjasama"] !== null && data["Keterangan Kerjasama"] !== undefined ? String(data["Keterangan Kerjasama"]).trim() : "";
  var kerjasamaUpper = kerjasamaValue.toUpperCase();

  else if (kerjasamaUpper.indexOf("INSTANSI") === 0) jenisKerjasamaDisplay = "Instansi";
  else if (kerjasamaValue !== "") jenisKerjasamaDisplay = "Lainnya";
  var isLainnya = jenisKerjasamaDisplay === "Lainnya";
  var isFree = data["Kategori Lokasi"] && String(data["Kategori Lokasi"]).toUpperCase() === "FREE";

  var html = '';

  html += '<div class="form-group" style="flex:1;"><label>KC Supervisi *</label><input type="text" id="edit_full_kc" value="' + escapeHtml(dataKc) + '" readonly disabled style="background:#f1f5f9;"></div>';

  html += '<div class="form-group" style="flex:1;display:none;" id="editFullInstansiRow"><label>Nama Instansi *</label><input type="text" id="edit_full_nama_instansi"></div>';

  html += '<div class="btn-group" style="display:flex;gap:1rem;margin-top:1.5rem;">';
  html += '<button id="submitEditFullBtn" onclick="submitEditFullData()" style="background:#16a34a;color:white;flex:1;padding:0.75rem;border:none;border-radius:8px;font-weight:600;cursor:pointer;">💾 Simpan Perubahan</button>';
  html += '<button id="deleteEditFullBtn" onclick="deleteEditFullData()" style="background:#dc2626;color:white;flex:1;padding:0.75rem;border:none;border-radius:8px;font-weight:600;cursor:pointer;">🗑️ Hapus Data</button>';

function toggleEditFullFree() {
  var kategori = document.getElementById("edit_full_kategori_lokasi")?.value;
  var isFree = kategori === "Free";
  var hargaSebelumnya = document.getElementById("edit_full_harga_sebelumnya");
  var hargaTerbaru = document.getElementById("edit_full_harga_terbaru");
  var periodeBulan = document.getElementById("edit_full_periode_bulan");
  var mekanisme = document.getElementById("edit_full_mekanisme_pembayaran");
  var tglAwal = document.getElementById("edit_full_tanggal_awal");
  var tglBerakhir = document.getElementById("edit_full_tanggal_berakhir");
  var keterangan = document.getElementById("edit_full_keterangan");
  if (isFree) {
    if (hargaSebelumnya) { hargaSebelumnya.value = "0"; hargaSebelumnya.disabled = true; hargaSebelumnya.style.background = "#e9ecef"; }
    if (hargaTerbaru) { hargaTerbaru.value = "0"; hargaTerbaru.disabled = true; hargaTerbaru.style.background = "#e9ecef"; }
    if (periodeBulan) { periodeBulan.value = "0"; periodeBulan.disabled = true; periodeBulan.style.background = "#e9ecef"; }
    if (mekanisme) { mekanisme.value = ""; mekanisme.disabled = true; mekanisme.style.background = "#e9ecef"; }
    if (tglAwal) { tglAwal.value = ""; tglAwal.disabled = true; tglAwal.style.background = "#e9ecef"; }
    if (tglBerakhir) { tglBerakhir.value = ""; tglBerakhir.disabled = true; tglBerakhir.style.background = "#e9ecef"; }
    if (keterangan) { keterangan.placeholder = "Isi keterangan untuk Free"; }
  } else {
    if (hargaSebelumnya) { hargaSebelumnya.disabled = false; hargaSebelumnya.style.background = ""; }
    if (hargaTerbaru) { hargaTerbaru.disabled = false; hargaTerbaru.style.background = ""; }
    if (periodeBulan) { periodeBulan.disabled = false; periodeBulan.style.background = ""; }
    if (mekanisme) { mekanisme.disabled = false; mekanisme.style.background = ""; }
    if (tglAwal) { tglAwal.disabled = false; tglAwal.style.background = ""; }
    if (keterangan) { keterangan.placeholder = ""; }
  }
}

function updateEditFullEndDate() {
  var startDate = document.getElementById("edit_full_tanggal_awal")?.value;
  var periode = document.getElementById("edit_full_periode_bulan")?.value;
  var endDate = document.getElementById("edit_full_tanggal_berakhir");
  var kategori = document.getElementById("edit_full_kategori_lokasi")?.value;
  if (kategori === "Free") { if (endDate) endDate.value = ""; return; }
  if (endDate && startDate && periode && parseInt(periode) > 0) {
    var parts = startDate.split('/');
    if (parts.length === 3) {
      var day = parseInt(parts[0]), month = parseInt(parts[1]) - 1, year = parseInt(parts[2]);
      if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
        var endDateObj = new Date(year, month + parseInt(periode), day);
        endDateObj.setDate(endDateObj.getDate() - 1);
        endDate.value = endDateObj.getDate().toString().padStart(2, '0') + '/' + (endDateObj.getMonth() + 1).toString().padStart(2, '0') + '/' + endDateObj.getFullYear();
        return;
      }
    }
  }
  if (endDate) endDate.value = "";
}

function submitEditFullData() {

  if (!namaLokasi) { showAlert("Nama Lokasi wajib diisi", "Validasi Gagal", "⚠️"); return; }

  var kategori = kategoriEl?.value || "";
  var isFree = kategori === "Free";
  var keteranganKerjasama = "";
  if (kategori === "Kerjasama") {
    if (!jenisKerjasamaEl || !jenisKerjasamaEl.value) { showAlert("Pilih Jenis Kerjasama", "Validasi Gagal", "⚠️"); return; }
    var jv = jenisKerjasamaEl.value;

    else if (jv === "Lainnya") { keteranganKerjasama = kerjasamaLainEl?.value?.trim() || ""; if (!keteranganKerjasama) { showAlert("Isi Keterangan Kerjasama", "Validasi Gagal", "⚠️"); return; } }
  }
  var hargaSebelumnya = document.getElementById("edit_full_harga_sebelumnya")?.value || "0";
  var hargaTerbaru = document.getElementById("edit_full_harga_terbaru")?.value || "0";

  var mekanisme = document.getElementById("edit_full_mekanisme_pembayaran")?.value || "FULL";
  var tanggalAwal = document.getElementById("edit_full_tanggal_awal")?.value || "";
  var tanggalBerakhir = document.getElementById("edit_full_tanggal_berakhir")?.value || "";
  var keterangan = document.getElementById("edit_full_keterangan")?.value || "";
  var jenisMesin = document.getElementById("edit_full_jenis_mesin")?.value || "ATM";
  var statusSewa = document.getElementById("edit_full_status_sewa")?.value || "SW 1 - Baru";
  var hargaTerbaruNum = parseNumberFromFormat(hargaTerbaru);
  if (!isFree && (!hargaTerbaruNum || parseInt(hargaTerbaruNum) <= 0)) { showAlert("Harga Sewa Terbaru wajib diisi", "Validasi Gagal", "⚠️"); return; }
  if (isFree) { hargaSebelumnya = "0"; hargaTerbaru = "0"; periodeBulan = "0"; mekanisme = ""; tanggalAwal = ""; tanggalBerakhir = ""; }
  var updatedData = {
    "Terminal ID": terminalId, "Nama Lokasi": namaLokasi, "Jenis Mesin": jenisMesin,
    "Status Sewa": statusSewa, "Kategori Lokasi": kategori, "Keterangan Kerjasama": keteranganKerjasama,

    "Harga Sewa Terbaru": parseNumberFromFormat(hargaTerbaru),
    "Periode Bulan": parseNumberFromFormat(periodeBulan),
    "Mekanisme Pembayaran": mekanisme, "Tanggal Awal": tanggalAwal,
    "Tanggal Berakhir": tanggalBerakhir, "Keterangan": keterangan
  };
  var originalText = submitBtn.innerText;
  submitBtn.innerHTML = "⏳ Menyimpan..."; submitBtn.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {

        showOperationResult(res, "✅ Data Berhasil Diupdate", "✅");

      showAlert("Error: " + err.message, "Error Server", "❌");

function deleteEditFullData() {
  var terminalId = document.getElementById("edit_full_terminal_id")?.value?.trim() || "";
  var rowIndex = currentEditRowIndex;
  if (!terminalId) { showAlert("Terminal ID tidak ditemukan.", "Gagal", "❌"); return; }

  if (!sewaLoginData) { showAlert("Sesi login tidak ditemukan.", "Gagal", "❌"); return; }
  var pesan = "Apakah Anda yakin ingin menghapus data berikut?\n\nTerminal ID : " + terminalId + "\nBaris Data  : " + rowIndex + "\n\n⚠️ Tidak dapat dikembalikan.";
  showConfirm(pesan, "Konfirmasi Hapus Data", "🗑️", false).then(function(confirmed) {
    if (!confirmed) return;
    var deleteBtn = document.getElementById("deleteEditFullBtn");
    var submitBtn = document.getElementById("submitEditFullBtn");
    var originalText = deleteBtn ? deleteBtn.innerHTML : "🗑️ Hapus Data";
    if (deleteBtn) { deleteBtn.disabled = true; deleteBtn.innerHTML = "⏳ Menghapus..."; }
    if (submitBtn) submitBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function(res) {
        if (deleteBtn) { deleteBtn.disabled = false; deleteBtn.innerHTML = originalText; }
        if (submitBtn) submitBtn.disabled = false;

          showOperationResult(res, "🗑️ Data Berhasil Dihapus", "🗑️");

          if (lastActiveTab === 'dashboard') loadDataWithFilters(true);

          if (detailDiv) { detailDiv.innerHTML = ""; detailDiv.style.display = "none"; }

        if (deleteBtn) { deleteBtn.disabled = false; deleteBtn.innerHTML = originalText; }

  });
}

    .withSuccessHandler(function(kcs) {

function updateAddEndDate() {
  var s = document.getElementById("add_tanggal_awal")?.value;
  var p = document.getElementById("add_periode_bulan")?.value;
  var berakhir = document.getElementById("add_tanggal_berakhir");
  if (!berakhir) return;
  if (s && p && parseInt(p) > 0) {
    var pts = s.split('/');
    if (pts.length === 3) {
      var day = parseInt(pts[0]), month = parseInt(pts[1]) - 1, year = parseInt(pts[2]);
      if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
        var endDate = new Date(year, month + parseInt(p), day);
        endDate.setDate(endDate.getDate() - 1);
        berakhir.value = endDate.getDate().toString().padStart(2, '0') + '/' + (endDate.getMonth() + 1).toString().padStart(2, '0') + '/' + endDate.getFullYear();
        return;
      }
    }
  }
  berakhir.value = "";
}

function toggleAddKeteranganKerjasama() {
  var kat = document.getElementById("add_kategori_lokasi")?.value;
  var row = document.getElementById("addKerjasamaRow");
  var lainRow = document.getElementById("addKerjasamaLainRow");
  var instansiRow = document.getElementById("addInstansiRow");
  var jenisSelect = document.getElementById("add_jenis_kerjasama");
  if (kat === "Free") {
    if (row) row.style.display = "none";
    if (lainRow) lainRow.style.display = "none";
    if (instansiRow) instansiRow.style.display = "none";
    if (jenisSelect) jenisSelect.value = "";
    var freeFields = ['add_harga_sebelumnya', 'add_harga_terbaru', 'add_periode_bulan', 'add_mekanisme_pembayaran', 'add_tanggal_awal', 'add_tanggal_berakhir'];
    freeFields.forEach(function(id) {
      var field = document.getElementById(id);
      if (field) { field.disabled = true; field.style.background = "#e9ecef"; if (id === 'add_mekanisme_pembayaran') field.value = ""; else field.value = "0"; }
    });
    var keterangan = document.getElementById("add_keterangan");
    if (keterangan) { keterangan.disabled = false; keterangan.placeholder = "Isi keterangan untuk Free"; }
    return;
  }
  var enableFields = ['add_harga_sebelumnya', 'add_harga_terbaru', 'add_periode_bulan', 'add_mekanisme_pembayaran', 'add_tanggal_awal', 'add_tanggal_berakhir'];
  enableFields.forEach(function(id) {
    var field = document.getElementById(id);
    if (field) { field.disabled = false; field.style.background = ""; if (id === 'add_mekanisme_pembayaran' && !field.value) field.value = "FULL"; }
  });
  var keterangan = document.getElementById("add_keterangan");
  if (keterangan) { keterangan.disabled = false; keterangan.placeholder = ""; }
  if (row && kat) {
    row.style.display = (kat === "Kerjasama") ? "flex" : "none";
    if (kat !== "Kerjasama") {
      if (jenisSelect) jenisSelect.value = "";
      if (lainRow) lainRow.style.display = "none";
      if (instansiRow) instansiRow.style.display = "none";
    }
  }
}

function toggleAddKerjasamaFields() {
  var jenisKerjasama = document.getElementById("add_jenis_kerjasama")?.value;
  var kerjasamaLainRow = document.getElementById("addKerjasamaLainRow");
  var instansiRow = document.getElementById("addInstansiRow");
  function resetFields() {
    var allFields = ['add_harga_sebelumnya', 'add_harga_terbaru', 'add_periode_bulan', 'add_mekanisme_pembayaran', 'add_tanggal_awal', 'add_tanggal_berakhir', 'add_keterangan'];
    allFields.forEach(function(id) {
      var field = document.getElementById(id);
      if (field) {
        var isIndomaret = (document.getElementById("add_jenis_kerjasama")?.value === "Indomaret");
        if (!isIndomaret) { field.disabled = false; field.style.background = ""; }
        if (id === 'add_mekanisme_pembayaran' && !isIndomaret) field.value = "FULL";
      }
    });
  }
  var kategori = document.getElementById("add_kategori_lokasi")?.value;
  if (kategori === "Free") return;
  if (kerjasamaLainRow) kerjasamaLainRow.style.display = "none";
  if (instansiRow) instansiRow.style.display = "none";
  if (jenisKerjasama === "Indomaret") { handleAddIndomaretSelection(); if (kerjasamaLainRow) kerjasamaLainRow.style.display = "block"; return; }
  if (jenisKerjasama === "Alfamart" || jenisKerjasama === "Pegadaian") resetFields();
  else if (jenisKerjasama === "Instansi") { if (instansiRow) instansiRow.style.display = "flex"; resetFields(); }
  else if (jenisKerjasama === "Lainnya") { if (kerjasamaLainRow) kerjasamaLainRow.style.display = "flex"; resetFields(); }
  else resetFields();
  if (typeof updateAddEndDate === 'function') updateAddEndDate();
}

function handleAddIndomaretSelection() {
  var jenisKerjasama = document.getElementById("add_jenis_kerjasama")?.value;
  var kategori = document.getElementById("add_kategori_lokasi")?.value;
  if (kategori === "Kerjasama" && jenisKerjasama === "Indomaret") {
    var currentYear = new Date().getFullYear();
    var fields = { 'add_harga_sebelumnya': "18.000.000", 'add_harga_terbaru': "18.000.000", 'add_periode_bulan': "12", 'add_mekanisme_pembayaran': "FULL", 'add_tanggal_awal': "01/01/" + currentYear, 'add_tanggal_berakhir': "31/12/" + currentYear, 'add_keterangan': "Kerjasama Terpusat" };
    Object.keys(fields).forEach(function(id) {
      var field = document.getElementById(id);
      if (field) { field.value = fields[id]; field.disabled = true; field.style.background = "#e9ecef"; }
    });
    var kerjasamaLain = document.getElementById("add_keterangan_kerjasama_lain");
    if (kerjasamaLain) kerjasamaLain.value = "Indomaret";

  var tanggalBerakhir = document.getElementById("add_tanggal_berakhir")?.value || "";

  submitBtn.innerHTML = '<span class="loading-spinner" style="display:inline-block;width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;"></span> Menyimpan...';

function loadManagementData() {

    allHeaders = cachedManagementData.headers || [];
    allRows = cachedManagementData.rows || [];
    originalIndices = cachedManagementData.originalIndices || [];
    return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || res.error) return;
      allHeaders = res.headers || [];
      allRows = res.rows || [];
      originalIndices = res.originalIndices || [];
      cachedManagementData = { headers: allHeaders, rows: allRows, originalIndices: originalIndices };
      isManagementLoaded = true;

function openKerjasamaEditForm(terminalId) {
  if (!terminalId) { showAlert("Terminal ID tidak valid", "Error", "❌"); return; }
  var cachedData = null;
  var cachedRowIndex = null;
  if (cachedKerjasamaData && cachedKerjasamaData.rawRows && cachedKerjasamaData.headers) {
    var headers = cachedKerjasamaData.headers;
    var rows = cachedKerjasamaData.rawRows;
    var terminalIdIdx = -1;
    for (var i = 0; i < headers.length; i++) { if (String(headers[i]).trim().toLowerCase() === "terminal id") { terminalIdIdx = i; break; } }
    if (terminalIdIdx !== -1) {
      for (var r = 0; r < rows.length; r++) {
        var rowTerminalId = String(rows[r][terminalIdIdx] || "").trim();
        if (rowTerminalId === String(terminalId).trim()) {
          var dataObj = {};
          for (var h = 0; h < headers.length; h++) {
            var val = rows[r][h];
            if (val instanceof Date) val = val.getDate().toString().padStart(2,'0') + '/' + (val.getMonth()+1).toString().padStart(2,'0') + '/' + val.getFullYear();
            dataObj[headers[h]] = (val === null || val === undefined) ? "" : String(val);
          }
          cachedData = dataObj;
          cachedRowIndex = r;
          break;
        }
      }
    }
  }
  var filterKerjasama = document.getElementById("kerjasamaFilterKerjasama")?.value || "Semua";
  var filterSection = document.getElementById("kerjasamaFilterSummarySection");
  var tableContainer = document.getElementById("kerjasamaTable");
  var editContainer = document.getElementById("kerjasamaEditContainer");
  var detailForm = document.getElementById("kerjasamaEditDetailForm");
  var titleSpan = document.getElementById("editKerjasamaTerminalTitle");
  if (filterSection) filterSection.style.display = "none";
  if (tableContainer) tableContainer.style.display = "none";
  if (editContainer) editContainer.style.display = "block";
  if (titleSpan) titleSpan.innerText = terminalId;
  if (cachedData) {
    currentKerjasamaRowIndex = cachedRowIndex + 2;
    buildKerjasamaEditDetailForm(cachedData, filterKerjasama);
  } else {
    if (detailForm) detailForm.innerHTML = '<div style="text-align:center; padding:2rem;"><div class="loading-spinner"></div><p>Memuat data...</p></div>';
    showFullLoader();
    google.script.run
      .withSuccessHandler(function(res) {
        hideFullLoader();
        if (!res.success) { showAlert(res.message, "Akses Ditolak", "🔒"); closeKerjasamaEditForm(); return; }
        currentKerjasamaRowIndex = res.rowIndex;
        buildKerjasamaEditDetailForm(res.data, filterKerjasama);
      })
      .withFailureHandler(function(err) {
        hideFullLoader();
        showAlert("Error: " + err.message, "Gagal", "❌");
        closeKerjasamaEditForm();
      })
      .getDataByTerminalId(sewaLoginData, terminalId);
  }
}

function submitKerjasamaEditData() {
  var submitBtn = document.getElementById("submitKerjasamaEditBtn");
  var namaLokasi = document.getElementById("kerjasama_edit_nama_lokasi")?.value?.trim();
  if (!namaLokasi) { showAlert("Nama Lokasi wajib diisi", "Validasi Gagal", "⚠️"); return; }
  var regional = document.getElementById("kerjasama_edit_regional")?.value?.trim() || "";
  var kc = document.getElementById("kerjasama_edit_kc")?.value?.trim() || "";
  var kategoriEl = document.getElementById("kerjasama_edit_kategori_lokasi");
  var jenisKerjasamaEl = document.getElementById("kerjasama_edit_jenis_kerjasama");
  var kerjasamaLainEl = document.getElementById("kerjasama_edit_keterangan_kerjasama_lain");
  var kategori = kategoriEl?.value || "";
  var keteranganKerjasama = "";
  var isFree = kategori === "Free";
  if (kategori === "Kerjasama") {
    if (!jenisKerjasamaEl || !jenisKerjasamaEl.value) { showAlert("Pilih Jenis Kerjasama", "Validasi Gagal", "⚠️"); return; }
    if (jenisKerjasamaEl.value === "Alfamart") keteranganKerjasama = "Alfamart";
    else if (jenisKerjasamaEl.value === "Pegadaian") keteranganKerjasama = "Pegadaian";
    else if (jenisKerjasamaEl.value === "Instansi") {
      var namaInstansi = document.getElementById("kerjasama_edit_nama_instansi")?.value?.trim();
      if (!namaInstansi) { showAlert("Isi Nama Instansi", "Validasi Gagal", "⚠️"); return; }
      keteranganKerjasama = "Instansi - " + namaInstansi;
    } else if (jenisKerjasamaEl.value === "Lainnya") {
      keteranganKerjasama = kerjasamaLainEl?.value?.trim() || "";
      if (!keteranganKerjasama) { showAlert("Isi Keterangan Kerjasama", "Validasi Gagal", "⚠️"); return; }
    }
  }
  var hargaSebelumnya = document.getElementById("kerjasama_edit_harga_sebelumnya")?.value || "";
  var hargaTerbaru = document.getElementById("kerjasama_edit_harga_terbaru")?.value || "";
  var periodeBulan = document.getElementById("kerjasama_edit_periode_bulan")?.value || "";
  var mekanisme = document.getElementById("kerjasama_edit_mekanisme_pembayaran")?.value || "";
  var tanggalAwal = document.getElementById("kerjasama_edit_tanggal_awal")?.value || "";
  var tanggalBerakhir = document.getElementById("kerjasama_edit_tanggal_berakhir")?.value || "";
  var keterangan = document.getElementById("kerjasama_edit_keterangan")?.value || "";
  var hargaTerbaruNum = parseNumberFromFormat(hargaTerbaru);
  if (!isFree && (!hargaTerbaruNum || parseInt(hargaTerbaruNum) <= 0)) { showAlert("Harga Sewa Terbaru wajib diisi", "Validasi Gagal", "⚠️"); return; }
  if (isFree) { hargaSebelumnya = "0"; hargaTerbaru = "0"; periodeBulan = "0"; mekanisme = ""; tanggalAwal = ""; tanggalBerakhir = ""; }
  var updatedData = {
    "Regional Office": regional, "KC Supervisi": kc, "Nama Lokasi": namaLokasi,
    "Jenis Mesin": document.getElementById("kerjasama_edit_jenis_mesin")?.value || "",
    "Status Sewa": document.getElementById("kerjasama_edit_status_sewa")?.value || "",
    "Kategori Lokasi": kategori, "Keterangan Kerjasama": keteranganKerjasama,
    "Harga Sewa Sebelumnya": parseNumberFromFormat(hargaSebelumnya),
    "Harga Sewa Terbaru": parseNumberFromFormat(hargaTerbaru),
    "Periode Bulan": parseNumberFromFormat(periodeBulan),
    "Mekanisme Pembayaran": mekanisme, "Tanggal Awal": tanggalAwal,
    "Tanggal Berakhir": tanggalBerakhir, "Keterangan": keterangan,
    "Terminal ID": document.getElementById("kerjasama_edit_terminal_id")?.value || ""
  };
  submitBtn.innerHTML = "Menyimpan..."; submitBtn.disabled = true;
  google.script.run
    .withSuccessHandler(function(res) {
      submitBtn.innerText = "💾 Simpan Perubahan"; submitBtn.disabled = false;
      if (res.success) {
        showOperationResult(res, "✅ Data Kerjasama Berhasil Diupdate", "✅");
        updateKerjasamaCacheAfterEdit();
        invalidateDashboardCache(); invalidateViewCache(); invalidateRekapCache(); invalidateManagementCache();
        loadManagementData();
        closeKerjasamaEditForm();
      } else showAlert(res.message, "Gagal", "❌");
    })
    .withFailureHandler(function(err) {
      submitBtn.innerText = "💾 Simpan Perubahan"; submitBtn.disabled = false;
      showAlert("Error: " + err.message, "Error Server", "❌");
    })
    .updateKerjasamaData(sewaLoginData, currentKerjasamaRowIndex, updatedData);
}

function updateKerjasamaCacheAfterEdit() {
  if (!cachedKerjasamaData || !cachedKerjasamaData.rawRows || !cachedKerjasamaData.headers) return;
  var headers = cachedKerjasamaData.headers;
  var rows = cachedKerjasamaData.rawRows;
  var terminalId = document.getElementById("kerjasama_edit_terminal_id")?.value?.trim();
  if (!terminalId) return;
  var terminalIdIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === "terminal id"; });
  if (terminalIdIdx === -1) return;
  var rowIdx = -1;
  for (var r = 0; r < rows.length; r++) { if (String(rows[r][terminalIdIdx] || "").trim() === terminalId) { rowIdx = r; break; } }
  if (rowIdx === -1) return;
  var updates = {
    "Regional Office": document.getElementById("kerjasama_edit_regional")?.value?.trim() || "",
    "KC Supervisi": document.getElementById("kerjasama_edit_kc")?.value?.trim() || "",
    "Nama Lokasi": document.getElementById("kerjasama_edit_nama_lokasi")?.value?.trim() || "",
    "Jenis Mesin": document.getElementById("kerjasama_edit_jenis_mesin")?.value || "",
    "Status Sewa": document.getElementById("kerjasama_edit_status_sewa")?.value || "",
    "Kategori Lokasi": document.getElementById("kerjasama_edit_kategori_lokasi")?.value || "",
    "Keterangan Kerjasama": "",
    "Harga Sewa Sebelumnya": parseNumberFromFormat(document.getElementById("kerjasama_edit_harga_sebelumnya")?.value || "0"),
    "Harga Sewa Terbaru": parseNumberFromFormat(document.getElementById("kerjasama_edit_harga_terbaru")?.value || "0"),
    "Periode Bulan": parseNumberFromFormat(document.getElementById("kerjasama_edit_periode_bulan")?.value || "0"),
    "Mekanisme Pembayaran": document.getElementById("kerjasama_edit_mekanisme_pembayaran")?.value || "",
    "Tanggal Awal": document.getElementById("kerjasama_edit_tanggal_awal")?.value || "",
    "Tanggal Berakhir": document.getElementById("kerjasama_edit_tanggal_berakhir")?.value || "",
    "Keterangan": document.getElementById("kerjasama_edit_keterangan")?.value || ""
  };
  var kategoriLokasi = document.getElementById("kerjasama_edit_kategori_lokasi")?.value;
  if (kategoriLokasi === "Kerjasama") {
    var jv = document.getElementById("kerjasama_edit_jenis_kerjasama")?.value;
    if (jv === "Alfamart" || jv === "Pegadaian") updates["Keterangan Kerjasama"] = jv;
    else if (jv === "Instansi") updates["Keterangan Kerjasama"] = "Instansi - " + (document.getElementById("kerjasama_edit_nama_instansi")?.value?.trim() || "");
    else if (jv === "Lainnya") updates["Keterangan Kerjasama"] = document.getElementById("kerjasama_edit_keterangan_kerjasama_lain")?.value?.trim() || "";
  }
  Object.keys(updates).forEach(function(key) {
    var colIdx = headers.findIndex(function(h) { return String(h).trim().toLowerCase() === key.toLowerCase(); });
    if (colIdx !== -1) rows[rowIdx][colIdx] = updates[key];
  });
}

function openChangePasswordModal() {
  if (!currentActiveVendor) { showToast('warning', 'Silakan login terlebih dahulu.'); return; }
  document.getElementById('oldPasswordInput').value = '';
  document.getElementById('newPasswordInput').value = '';
  document.getElementById('confirmPasswordInput').value = '';
  var m = bootstrap.Modal.getOrCreateInstance(document.getElementById('changePasswordModal'));
  m.show();

function processChangePassword() {
  var oldPass = document.getElementById('oldPasswordInput').value.trim();
  var newPass = document.getElementById('newPasswordInput').value.trim();
  var confirmPass = document.getElementById('confirmPasswordInput').value.trim();
  if (!oldPass) { showToast('warning', 'Masukkan Password Lama.'); return; }
  if (!newPass) { showToast('warning', 'Masukkan Password Baru.'); return; }
  if (newPass.length < 4) { showToast('warning', 'Password Baru minimal 4 karakter.'); return; }
  if (newPass !== confirmPass) { showToast('danger', 'Konfirmasi tidak cocok!'); return; }
  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent = "Memperbarui password...";
  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (res && res.success) {
        var m = bootstrap.Modal.getInstance(document.getElementById('changePasswordModal'));
        if (m) m.hide();
        showToast('success', '🔑 Password berhasil diubah!');
      } else showToast('danger', '❌ ' + (res.message || 'Gagal mengubah password.'));
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      showToast('danger', 'Error sistem: ' + err.message);
    })
    .changeUserPassword(currentActiveVendor, oldPass, newPass);
}

function handleUsernameKeyPress(e) {
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    var passwordInput = document.getElementById('loginPasswordInput');
    if (passwordInput) passwordInput.focus();
  }
}

// ====================================================================
// DOM READY
// ====================================================================
document.addEventListener('DOMContentLoaded', function() {
  renderFlowQuestion('start');
  showLandingPage();

  var now = new Date();
  var currentMonth = String(now.getMonth() + 1);
  var currentYear = String(now.getFullYear());

  var dMonth = document.getElementById('dashFilterMonth'); if (dMonth) dMonth.value = currentMonth;
  var dYear = document.getElementById('dashFilterYear'); if (dYear) dYear.value = currentYear;
  var vMonth = document.getElementById('visitFilterMonth'); if (vMonth) vMonth.value = currentMonth;
  var vYear = document.getElementById('visitFilterYear'); if (vYear) vYear.value = currentYear;

  ['dashFilterYear', 'visitFilterYear'].forEach(function(selId) {
    var sel = document.getElementById(selId); if (!sel) return;
    var exists = false;
    for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === currentYear) { exists = true; break; } }
    if (!exists) { var opt = document.createElement('option'); opt.value = currentYear; opt.textContent = currentYear; sel.appendChild(opt); }
    sel.value = currentYear;
  });

  var searchTerminalId = document.getElementById("searchTerminalId");
  if (searchTerminalId) searchTerminalId.addEventListener("keypress", function(e) { if (e.key === "Enter") searchDataForExtend(); });
  var searchBtn = document.getElementById("searchBtn");
  if (searchBtn) searchBtn.addEventListener("click", searchDataForExtend);
  var editSearchTerminalId = document.getElementById("editSearchTerminalId");
  if (editSearchTerminalId) editSearchTerminalId.addEventListener("keypress", function(e) { if (e.key === "Enter") searchDataForEdit(); });
  var editSearchBtn = document.getElementById("editSearchBtn");
  if (editSearchBtn) editSearchBtn.addEventListener("click", searchDataForEdit);
  var changeSearchTerminalId = document.getElementById("changeSearchTerminalId");
  if (changeSearchTerminalId) changeSearchTerminalId.addEventListener("keypress", function(e) { if (e.key === "Enter") searchDataForChangeTerminal(); });
  var changeSearchBtn = document.getElementById("changeSearchBtn");
  if (changeSearchBtn) changeSearchBtn.addEventListener("click", searchDataForChangeTerminal);
  var addCheckBtn = document.getElementById("addCheckBtn");
  if (addCheckBtn) addCheckBtn.addEventListener("click", checkTerminalIdForAdd);
  var addCheckTerminalId = document.getElementById("addCheckTerminalId");
  if (addCheckTerminalId) addCheckTerminalId.addEventListener("keypress", function(e) { if (e.key === "Enter") checkTerminalIdForAdd(); });

  document.querySelectorAll("#filterJatuhTempo, #filterTahun, #filterRegional, #filterKC").forEach(function(el) {
    if (el) el.addEventListener("change", function() { if (currentActiveVendor) { invalidateDashboardCache(); loadDataWithFilters(true); } });
  });
  document.querySelectorAll("#viewFilterJatuhTempo, #viewFilterTahun, #viewFilterRegional, #viewFilterKC").forEach(function(el) {
    if (el) el.addEventListener("change", function() { if (currentActiveVendor) { invalidateViewCache(); loadViewDataWithFilters(false); } });
  });
  ["kerjasamaFilterKerjasama", "kerjasamaFilterRegional", "kerjasamaFilterKC"].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("change", function() { if (cachedKerjasamaData) applyKerjasamaLocalFilter(); else if (sewaLoginData) loadKerjasamaData(true); });
  });

  var exportExcelBtn = document.getElementById("exportExcelBtn");
  if (exportExcelBtn) exportExcelBtn.addEventListener("click", exportToExcel);
  var exportRekapBtn = document.getElementById("exportRekapExcelBtn");
  if (exportRekapBtn) exportRekapBtn.addEventListener("click", exportRekapToExcel);

  document.addEventListener('click', function(e) {
    var target = e.target;
    if (target && target.classList && target.classList.contains('edit-btn-kerjasama')) {
      e.preventDefault(); e.stopPropagation();
      var terminalId = target.getAttribute('data-terminal');
      if (terminalId) openKerjasamaEditForm(terminalId);
    }
  });

  var modalEl = document.getElementById('photoPreviewModal');
  if (modalEl) {
    modalEl.addEventListener('shown.bs.modal', function() {
      photoZoomState.scale = 1;
      photoZoomState.translateX = 0;
      photoZoomState.translateY = 0;
      updatePhotoTransform();
      initPhotoZoomEvents();
    });
  }

  ['rekapFilterJatuhTempo', 'rekapFilterTahun'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', function() {
      if (sewaLoginData && sewaLoginData.type !== 'BO') {
        loadRekapitulasiData(true);
      }
    });
  });

  // ✅ Auto-focus ke kolom Username saat modal login terbuka
  var loginModalEl = document.getElementById('loginModal');
  if (loginModalEl) {
    loginModalEl.addEventListener('shown.bs.modal', function() {
      var usernameInput = document.getElementById('loginVendorSelect');
      if (usernameInput) {
        usernameInput.focus();
        // Kursor di akhir teks (jika ada isi)
        var val = usernameInput.value;
        usernameInput.setSelectionRange(val.length, val.length);
      }
    });
  }

  history.pushState(null, null, location.href);
  window.addEventListener('popstate', function() { history.pushState(null, null, location.href); });
});

// ====================================================================
// HISTORY & BEFORE UNLOAD
// ====================================================================
(function(){
  window.history.pushState({ qid: 'start' }, null, window.location.href);
  window.addEventListener('beforeunload', function(e){
    if (Object.keys(flowAnswers).length > 0 && currentQuestion !== 'end') {
      e.preventDefault(); e.returnValue = 'Refresh tidak diperbolehkan saat mengisi survey!'; return e.returnValue;
    }
  });
  window.addEventListener('popstate', function(){
    window.history.pushState({ qid: currentQuestion }, null, window.location.href);
    showToast('danger', '⚠️ Tombol Back/Refresh diblokir! Gunakan tombol Kembali/Reset.');
  });
})();
