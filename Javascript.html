// ====================================================================
// GLOBAL MODAL (ALERT & CONFIRM)
// ====================================================================
window.showConfirm = function(message, title, icon, isDelete, isFullHeight) {
  if (title === undefined) title = "Konfirmasi";
  if (icon === undefined) icon = "⚠️";
  if (isDelete === undefined) isDelete = false;
  if (isFullHeight === undefined) isFullHeight = false;
  return new Promise(function(resolve) {
    var mTitle = document.getElementById("modalTitle");
    var mMessage = document.getElementById("modalMessage");
    var mIcon = document.getElementById("modalIcon");
    var mFooter = document.getElementById("modalFooter");
    var mOverlay = document.getElementById("customModalOverlay");

    if (mTitle) mTitle.innerText = title;
    if (mMessage) mMessage.innerHTML = message;
    if (mIcon) mIcon.innerText = icon;

    var confirmBg = isDelete ? '#dc2626' : '#2563eb';
    if (mFooter) {
      mFooter.innerHTML = '<button id="modalCancelBtn" style="flex:1; padding:0.6rem; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Batal</button><button id="modalConfirmBtn" style="background:' + confirmBg + '; flex:1; padding:0.6rem; border:none; border-radius:8px; color:white; font-weight:600; cursor:pointer;">Ya, Lanjutkan</button>';
    }
    if (mOverlay) mOverlay.style.display = "flex";

    var cancelBtn = document.getElementById("modalCancelBtn");
    var confirmBtn = document.getElementById("modalConfirmBtn");
    if (cancelBtn) cancelBtn.onclick = function() { if (mOverlay) mOverlay.style.display = "none"; resolve(false); };
    if (confirmBtn) confirmBtn.onclick = function() { if (mOverlay) mOverlay.style.display = "none"; resolve(true); };
  });
};

window.showAlert = function(message, title, icon) {
  if (title === undefined) title = "Notifikasi";
  if (icon === undefined) icon = "🔔";
  return new Promise(function(resolve) {
    var mTitle = document.getElementById("modalTitle");
    var mMessage = document.getElementById("modalMessage");
    var mIcon = document.getElementById("modalIcon");
    var mFooter = document.getElementById("modalFooter");
    var mOverlay = document.getElementById("customModalOverlay");

    if (mTitle) mTitle.innerText = title;
    if (mMessage) mMessage.innerHTML = message;
    if (mIcon) mIcon.innerText = icon;
    if (mFooter) mFooter.innerHTML = '<button id="modalOkBtn" style="background:#2563eb; flex:1; padding:0.6rem; border:none; border-radius:8px; color:white; font-weight:600; cursor:pointer;">OK</button>';
    if (mOverlay) mOverlay.style.display = "flex";

    var okBtn = document.getElementById("modalOkBtn");
    if (okBtn) okBtn.onclick = function() { if (mOverlay) mOverlay.style.display = "none"; resolve(true); };
  });
};

function showOperationResult(res, successTitle, successIcon, failTitle, failIcon) {
  if (!res) { showAlert("Terjadi kesalahan tidak diketahui", "Error", "❌"); return; }
  if (res.success) {
    let message = res.message || "Operasi berhasil!";
    if (res.verified === false) message += "\n\n⚠️ Silakan refresh halaman untuk melihat data terbaru.";
    if (res.rowIndex) message += "\n📍 Baris: " + res.rowIndex;
    if (res.fieldsChanged !== undefined && res.fieldsChanged > 0) message += "\n📝 " + res.fieldsChanged + " field diubah";
    if (res.terminalId) message += "\n🆔 Terminal ID: " + res.terminalId;
    if (res.updatedCount !== undefined && res.updatedCount > 0) message += "\n📊 " + res.updatedCount + " data diupdate";
    showAlert(message, successTitle || "Berhasil", successIcon || "✅");
  } else {
    showAlert(res.message || "Operasi gagal", failTitle || "Gagal", failIcon || "❌");
  }
}

function escapeHtml(str) {
  if(!str) return "";
  return String(str).replace(/[&<>]/g, function(m){
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m] || m;
  });
}

function formatPrice(raw) {
  var num = parseFloat(String(raw).replace(/[^0-9.-]/g,''));
  if(isNaN(num)) return String(raw);
  return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

function formatPercentage(raw) {
  if (raw === null || raw === undefined || raw === '') return '0%';
  if (typeof raw === 'string' && raw.includes('%')) {
    var num = parseFloat(raw.replace('%', ''));
    if (!isNaN(num)) return num.toFixed(2) + '%';
    return raw;
  }
  var num = parseFloat(String(raw).replace(/[^0-9.-]/g,''));
  if(isNaN(num)) return '0%';
  return (num * 100).toFixed(2) + '%';
}

function formatCell(header, val) {
  var h = String(header).toLowerCase();
  if(h.includes('harga') || h.includes('jumlah pembayaran')) return formatPrice(val);
  if(h === 'kenaikan') {
    var num = parseFloat(String(val).replace(/[^0-9.-]/g,''));
    if(isNaN(num)) return '0%';
    return (num * 100).toFixed(2) + '%';
  }
  if(h === 'status perpanjangan' || h === 'kerjasama') {
    if (val === null || val === undefined || val === '') return '-';
    return String(val);
  }
  return String(val);
}

function formatRupiah(angka) {
  if (!angka || isNaN(angka)) return "Rp 0";
  return "Rp " + Math.round(angka).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function formatNumberInput(el) {
  var val = el.value.replace(/[^0-9]/g, '');
  el.value = val === "" ? "" : parseInt(val).toLocaleString('id-ID');
}

function parseNumberFromFormat(val) {
  if (!val) return "";
  var cleaned = String(val).replace(/[^0-9]/g, '');
  return cleaned || "0";
}

function formatDateInput(el) {
  var val = el.value.replace(/[^0-9]/g, '');
  if (val.length >= 2 && val.length < 4) el.value = val.substring(0,2) + '/' + val.substring(2);
  else if (val.length >= 4) el.value = val.substring(0,2) + '/' + val.substring(2,4) + '/' + val.substring(4,8);
}

function parseFrontendDate(dateStr) {
  if (!dateStr) return null;
  var parts = String(dateStr).split('/');
  if (parts.length === 3) {
    var day = parseInt(parts[0], 10);
    var month = parseInt(parts[1], 10) - 1;
    var year = parseInt(parts[2], 10);
    if (!isNaN(day) && !isNaN(month) && !isNaN(year)) return new Date(year, month, day);
  }
  return null;
}

// ====================================================================
// SHOW VIEW (dipindah ke luar switchView)
// ====================================================================
function showView(elementId, sidebarSelector) {
  var el = document.getElementById(elementId);

  if (!el) {
    console.error('[NAVIGASI] Elemen halaman tidak ditemukan:', elementId);
    var main = document.getElementById('mainContent');
    if (main) {
      main.innerHTML =
        '<div class="alert alert-danger m-3">' +
        '<h5>Halaman tidak ditemukan</h5>' +
        '<p>ID halaman: <b>' + elementId + '</b></p>' +
        '<p>Periksa ID elemen di Index.html.</p>' +
        '</div>';
    }
    return null;
  }

  var shell = document.getElementById('appShell');
  if (shell) {
    shell.classList.remove('d-none');
    shell.style.removeProperty('display');
  }

  el.classList.remove('d-none');
  el.style.removeProperty('display');

  var mainContent = document.getElementById('mainContent');
  if (mainContent) {
    mainContent.classList.remove('dashboard-mode');
  }

  var nav = document.querySelector(sidebarSelector);
  if (nav) {
    nav.classList.add('active');
  }

  var parent = el.parentElement;
  while (parent && parent !== document.body) {
    var css = window.getComputedStyle(parent);
    if (
      parent.classList.contains('d-none') ||
      css.display === 'none' ||
      css.visibility === 'hidden'
    ) {
      console.error('[NAVIGASI] Induk halaman tersembunyi:', elementId, parent.id || parent.className);
    }
    parent = parent.parentElement;
  }

  console.log('[NAVIGASI] Halaman dibuka:', elementId);
  return el;
}

function switchView(viewName) {
  var lp = document.getElementById('landingPage');
  var shell = document.getElementById('appShell');
  var sv = document.getElementById('surveyView');

  // ---- SURVEY (fullscreen, di luar shell) ----
  if (viewName === 'survey') {
    if (lp) lp.classList.add('d-none');
    if (shell) shell.classList.add('d-none');
    if (sv) {
      sv.classList.remove('d-none');
      sv.style.display = '';
    }
    return;
  }

  // ---- Mode APP (semua view di dalam appShell) ----
  if (lp) lp.classList.add('d-none');
  if (shell) shell.classList.remove('d-none');

  var viewIds = [
    'dashboardView', 'visitView', 'surveyView', 'kelolaanView', 'uploadView',
    'sewaDataView', 'rekapitulasiView', 'kerjasamaView',
    'extendView', 'editDeleteSewaView', 'tambahSewaView', 'gantiTidView'
  ];
  viewIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.classList.add('d-none');
      el.style.display = '';
    }
  });

  document.querySelectorAll('.sidebar-link').forEach(function(btn) {
    btn.classList.remove('active');
  });

  if (typeof stopRealTimeAutoRefresh === 'function') {
    stopRealTimeAutoRefresh();
  }

  var level = String(currentUserLevel || '').trim().toUpperCase();
  if (level === 'HEAD OFFICE') level = 'HO';

  // ---- DASHBOARD ----
  if (viewName === 'dashboard') {
    showView('dashboardView', '.sidebar-link[data-view="dashboard"]');
    var surveySection = document.getElementById('surveyDashboardSection');
    var sewaSection = document.getElementById('sewaDashboardSection');
    if (level === 'CRO' || level === 'KL') {
      if (surveySection) surveySection.classList.remove('d-none');
      if (sewaSection) sewaSection.classList.add('d-none');
    } else {
      if (surveySection) surveySection.classList.remove('d-none');
      if (sewaSection) sewaSection.classList.remove('d-none');
    }
    lastActiveTab = 'dashboard';

    if (typeof applyDashboardData === 'function' && dashboardCache && dashboardCache.raw) {
      applyDashboardData(dashboardCache.raw);
    } else if (typeof loadDashboardData === 'function' && !isDashboardLoaded) {
      loadDashboardData(false);
    }
    if ((level === 'HO' || level === 'RO' || level === 'BO') && sewaLoginData) {
      if (typeof renderDashboardData === 'function' && cachedDashboardData && cachedDashboardData.data) {
        renderDashboardData(cachedDashboardData.data);
      } else if (typeof loadDataWithFilters === 'function' && !isDashboardLoaded) {
        loadDataWithFilters(false);
      }
    }
    return;
  }

  // ---- VISIT ----
  if (viewName === 'visit') {
    showView('visitView', '.sidebar-link[data-view="visit"]');
    if (typeof ensureVisitDataLoaded === 'function') ensureVisitDataLoaded();
    if (typeof toggleRefreshButton === 'function') toggleRefreshButton();
    return;
  }

  // ---- KELOLAAN ----
  if (viewName === 'kelolaan') {
    if (level !== 'HO') {
      showToast('warning', 'Menu Data Kelolaan hanya untuk Head Office.');
      switchView('dashboard');
      return;
    }
    showView('kelolaanView', '.sidebar-link[data-view="kelolaan"]');
    if (typeof serverRawKelolaanData !== 'undefined' &&
        Array.isArray(serverRawKelolaanData) &&
        serverRawKelolaanData.length > 0) {
      kelolaanData = serverRawKelolaanData.slice();
      filteredKelolaanData = kelolaanData.slice();
      kelolaanCurrentPage = 1;
      if (editKelolaanCache.roList.length === 0 && typeof buildEditKelolaanCache === 'function') buildEditKelolaanCache();
      if (typeof buildTambahKelolaanDropdowns === 'function') buildTambahKelolaanDropdowns();
      if (typeof applyKelolaanMetaInfo === 'function') applyKelolaanMetaInfo();
      if (typeof switchKelolaanSubMenu === 'function') switchKelolaanSubMenu('edit');
    } else if (typeof loadKelolaanData === 'function') {
      loadKelolaanData(false);
    }
    return;
  }

  // ---- UPLOAD ----
  if (viewName === 'upload') {
    if (level !== 'HO') {
      showToast('warning', 'Menu Upload/Download hanya untuk Head Office.');
      switchView('dashboard');
      return;
    }
    showView('uploadView', '.sidebar-link[data-view="upload"]');
    return;
  }

  // ---- SEWA MENUS ----
  var sewaMenus = ['sewa-data', 'rekap', 'kerjasama', 'perpanjangan', 'edit-delete-sewa', 'tambah-sewa', 'ganti-tid'];
  if (sewaMenus.indexOf(viewName) !== -1) {
    if (typeof hasSewaAccess === 'function' && !hasSewaAccess()) {
      showToast('warning', 'Menu ini hanya dapat diakses oleh HO/RO/BO.');
      switchView('dashboard');
      return;
    }
  }

  if (viewName === 'sewa-data') {
    showView('sewaDataView', '.sidebar-link[data-view="sewa-data"]');
    lastActiveTab = 'view';
    if (typeof renderViewData === 'function' && cachedViewData && cachedViewData.data) {
      renderViewData(cachedViewData.data);
    } else if (typeof loadViewDataWithFilters === 'function') {
      loadViewDataWithFilters(false);
    }
    return;
  }

  if (viewName === 'rekap') {
    showView('rekapitulasiView', '.sidebar-link[data-view="rekap"]');
    lastActiveTab = 'rekapitulasi';
    if (typeof renderRekapitulasiData === 'function' && cachedRekapData && cachedRekapData.data) {
      renderRekapitulasiData(cachedRekapData.data);
    } else if (typeof loadRekapitulasiData === 'function' && !isRekapLoaded) {
      loadRekapitulasiData(false);
    }
    return;
  }

  if (viewName === 'kerjasama') {
    showView('kerjasamaView', '.sidebar-link[data-view="kerjasama"]');
    lastActiveTab = 'kerjasama';
    if (typeof loadKerjasamaFilterOptionsOnly === 'function') loadKerjasamaFilterOptionsOnly();
    if (cachedKerjasamaData) {
      if (typeof applyKerjasamaLocalFilter === 'function') applyKerjasamaLocalFilter();
    } else if (typeof loadKerjasamaData === 'function') {
      loadKerjasamaData(false);
    }
    return;
  }

  if (viewName === 'perpanjangan') {
    showView('extendView', '.sidebar-link[data-view="perpanjangan"]');
    lastActiveTab = 'perpanjangan';
    return;
  }

  if (viewName === 'edit-delete-sewa') {
    showView('editDeleteSewaView', '.sidebar-link[data-view="edit-delete-sewa"]');
    lastActiveTab = 'edit-delete-sewa';
    return;
  }

  if (viewName === 'tambah-sewa') {
    showView('tambahSewaView', '.sidebar-link[data-view="tambah-sewa"]');
    lastActiveTab = 'tambah-sewa';
    var step1 = document.getElementById('addStep1');
    var step2 = document.getElementById('addStep2');
    if (step1) step1.style.display = 'block';
    if (step2) step2.style.display = 'none';
    return;
  }

  if (viewName === 'ganti-tid') {
    showView('gantiTidView', '.sidebar-link[data-view="ganti-tid"]');
    lastActiveTab = 'ganti-tid';
    return;
  }

  console.warn('Menu tidak dikenal:', viewName);
}

function showToast(type, message) {
  var container = document.getElementById('toastContainer');
  if (!container) return;
  var colors = { success: 'bg-success', danger: 'bg-danger', warning: 'bg-warning', info: 'bg-primary' };
  var toast = document.createElement('div');
  toast.className = 'toast align-items-center text-white ' + (colors[type] || 'bg-dark') + ' border-0 show';
  toast.role = 'alert';
  toast.innerHTML = '<div class="d-flex"><div class="toast-body">' + message + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
  container.appendChild(toast);
  setTimeout(function(){ toast.classList.remove('show'); setTimeout(function(){ toast.remove(); }, 300); }, 3500);
}

function processVendorLogin() {
  flowAnswers = {};
  flowHistory = [];
  currentBase64Data = null;
  uploadedFileNames = {};
  purgeVisitDataCache();
  purgeDashboardCache();
  purgeKelolaanCache();
  resetAllCaches();
  kelolaanData = [];
  filteredKelolaanData = [];
  locationCache = {};

  var usernameInput = document.getElementById('loginVendorSelect');
  var passwordInput = document.getElementById('loginPasswordInput');
  var selectedUsername = usernameInput ? usernameInput.value.trim() : '';
  var passwordVal = passwordInput ? passwordInput.value.trim() : '';

  if (!selectedUsername) { showToast('warning', 'Silakan masukkan Username atau Level.'); if (usernameInput) usernameInput.focus(); return; }
  if (!passwordVal) { showToast('warning', 'Silakan masukkan Password.'); if (passwordInput) passwordInput.focus(); return; }

  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent = "Memverifikasi akun...";

  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (res && res.success) {
        currentActiveVendor = res.username || res.value || res.name || '';
        currentUserLevel = res.level;
        currentUserGroup = res.group || '';
        currentUserName = res.name || res.username || '';

        var lv = String(res.level || '').toUpperCase();
        if (lv === 'HEAD OFFICE') lv = 'HO';

        sewaLoginData = {
          type: lv,
          value: res.value || res.name || '',
          name: res.name || ''
        };

        var sessionData = { username: currentActiveVendor, level: res.level, loginTime: new Date().getTime() };
        sessionStorage.setItem('eChannelSession', JSON.stringify(sessionData));

        var lm = document.getElementById('loginModal');
        if (lm) { var modal = bootstrap.Modal.getInstance(lm); if (modal) modal.hide(); }

        var tempName = res.name || res.username || '-';
        if (lv === 'HO') tempName = 'Head Office';

        var shell = document.getElementById('appShell'); if (shell) shell.classList.remove('d-none');
        var sidebarUser = document.getElementById('loggedUsernameSidebar');
        if (sidebarUser) sidebarUser.textContent = tempName;

        var ll = document.getElementById('landingLoginBtn'); if (ll) ll.classList.add('d-none');
        var lo = document.getElementById('landingLogoutBtn'); if (lo) lo.classList.remove('d-none');

        setupVendorTabs();
        toggleRefreshButton();

        if (lv === 'HO' && typeof preloadKelolaanCache === 'function') preloadKelolaanCache();

        if (hasSewaAccess()) {
          if (typeof preloadAllSewaData === 'function') preloadAllSewaData();
        }

        switchView('dashboard');
        if (hasSewaAccess()) loadFilterOptions();

        setTimeout(function() {
          if (typeof loadVendorData === 'function' && currentActiveVendor && lv !== 'CRO' && lv !== 'KL') {
            loadVendorData(currentActiveVendor, true);
          }
        }, 800);
      } else {
        showToast('danger', '❌ ' + ((res && res.message) ? res.message : 'Username/Level atau Password salah.'));
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      showToast('danger', 'Error sistem atau koneksi: ' + err.message);
    })
    .verifyVendorLogin(selectedUsername, passwordVal);
}

// ====================================================================
// SESSION TIMEOUT
// ====================================================================
var SESSION_TIMEOUT_MS = 4 * 60 * 60 * 1000;

function checkSessionTimeout() {
  var rawSession = sessionStorage.getItem('eChannelSession');
  if (!rawSession) return true;
  try {
    var session = JSON.parse(rawSession);
    var now = new Date().getTime();
    if (now - session.loginTime > SESSION_TIMEOUT_MS) {
      sessionStorage.removeItem('eChannelSession');
      showToast('warning', 'Sesi Anda telah berakhir (Timeout). Silakan login kembali.');
      logoutUser();
      return false;
    }
    return true;
  } catch (e) {
    sessionStorage.removeItem('eChannelSession');
    return false;
  }
}

setInterval(function() { if (currentActiveVendor) checkSessionTimeout(); }, 5 * 60 * 1000);

function clearVisitTableData() {

  currentPage = 1;

  });

}

function purgeVisitDataCache() {
  serverRawVisitData = [];
  filteredVisitData = [];
  currentPage = 1;
  dashboardFiltersCache.kc_by_ro = {};
}

function ensureVisitDataLoaded() {
  if (!currentActiveVendor) return;
  if (serverRawVisitData && serverRawVisitData.length > 0) {
    var fakeFilters = {
      kl_cro:          collectUniqueFromCache('kl_cro'),
      regional_office: collectUniqueFromCache('regional_office'),
      kc_supervisi:    collectUniqueFromCache('kc_supervisi')
    };
    setupVisitFilterDropdowns(fakeFilters);
    applyClientFilters();
    return;
  }
  loadVendorData(currentActiveVendor, false);
}

function collectUniqueFromCache(key) {
  if (!serverRawVisitData || !serverRawVisitData.length) return [];
  var set = {};
  serverRawVisitData.forEach(function(row) {
    var v = String(row[key] || '').trim();
    if (v && v !== '-') set[v] = true;
  });
  return Object.keys(set).sort();
}

function loadVendorData(vendorName, isBackground) {
  if (!vendorName) vendorName = currentActiveVendor;
  if (!vendorName) return;
  currentActiveVendor = vendorName;

  if (!isBackground && serverRawVisitData && serverRawVisitData.length > 0) {
    var fakeFilters = {
      kl_cro:          collectUniqueFromCache('kl_cro'),
      regional_office: collectUniqueFromCache('regional_office'),
      kc_supervisi:    collectUniqueFromCache('kc_supervisi')
    };
    setupVisitFilterDropdowns(fakeFilters);
    applyClientFilters();
    return;
  }

  if (!isBackground) {
    clearVisitTableData();
    var t = document.getElementById('tableTitleLabel');
    if (t) t.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menarik data dari Server...';
  }

  isFetchingRealtime = true;
  var fm = document.getElementById('visitFilterMonth');
  var fy = document.getElementById('visitFilterYear');
  var filterMonth = fm ? fm.value : '';
  var filterYear = fy ? fy.value : '';

  google.script.run
    .withSuccessHandler(function(result) {
      isFetchingRealtime = false;
      if (!result.success) {
        if (!isBackground) {
          var tb = document.getElementById('visitTableBody');
          if (tb) tb.innerHTML = '<tr><td colspan="19" class="text-danger py-3">Terjadi kesalahan: ' + result.message + '</td></tr>';
        }
        return;
      }
      serverRawVisitData = result.data;
      setupVisitFilterDropdowns(result.filters || {});
      applyClientFilters();
    })
    .withFailureHandler(function(err) {
      isFetchingRealtime = false;
    })
    .getVisitData(vendorName, currentUserLevel, filterMonth, filterYear);
}

function setupVisitFilterDropdowns(filters) {
  var level = String(currentUserLevel || '').trim().toUpperCase();
  if (level === 'HEAD OFFICE') level = 'HO';

  var containerRo = document.getElementById('containerVisitFilterRo');
  var containerKc = document.getElementById('containerVisitFilterKc');
  var selectRo = document.getElementById('visitFilterRo');
  var selectKc = document.getElementById('visitFilterKc');
  var selectKlCro = document.getElementById('filterKlCro');
  var klCroContainer = document.getElementById('containerVisitFilterKlCro');

  // Reset visibility
  if (containerRo) containerRo.classList.add('d-none');
  if (containerKc) containerKc.classList.add('d-none');
  if (klCroContainer) klCroContainer.classList.add('d-none');

  // 1. Filter Kantor Layanan (Khusus CRO)
  if (level === 'CRO') {
    if (klCroContainer) klCroContainer.classList.remove('d-none');
    if (selectKlCro) {
      var prevCro = selectKlCro.value;
      selectKlCro.innerHTML = '<option value="">-- Semua Kantor Layanan --</option>';
      (filters.kl_cro || []).forEach(function(v) {
        selectKlCro.innerHTML += '<option value="' + v + '">' + v + '</option>';
      });
      if (prevCro) selectKlCro.value = prevCro;
    }
  }

  // 2. Filter RO & KC (Khusus HO & RO)
  if (level === 'HO') {
    if (containerRo) containerRo.classList.remove('d-none');
    if (selectRo) {
      var prevRo = selectRo.value;
      selectRo.innerHTML = '<option value="">-- Semua Regional Office --</option>';
      (filters.regional_office || []).forEach(function(v) {
        selectRo.innerHTML += '<option value="' + v + '">' + v + '</option>';
      });
      if (prevRo) selectRo.value = prevRo;
    }
    if (containerKc) containerKc.classList.remove('d-none');
    
    // Bangun map RO -> KC
    var kcByRo = {};
    serverRawVisitData.forEach(function(row) {
      var roRow = String(row.regional_office || row.ro || '').trim();
      var kcRow = String(row.kc_supervisi || '').trim();
      if (roRow && roRow !== '-' && kcRow && kcRow !== '-') {
        if (!kcByRo[roRow]) kcByRo[roRow] = {};
        kcByRo[roRow][kcRow] = true;
      }
    });
    dashboardFiltersCache.kc_by_ro = kcByRo;
    dashboardFiltersCache.kc_supervisi = filters.kc_supervisi || [];
    updateKcByRoVisit();
  }

  if (level === 'RO') {
    if (containerKc) containerKc.classList.remove('d-none');
    if (selectKc) {
      var prevKc = selectKc.value;
      selectKc.innerHTML = '<option value="">-- Semua KC Supervisi --</option>';
      (filters.kc_supervisi || []).forEach(function(v) {
        selectKc.innerHTML += '<option value="' + v + '">' + v + '</option>';
      });
      if (prevKc) selectKc.value = prevKc;
    }
  }
}

function updateKcByRoVisit() {
  var selectRo = document.getElementById('visitFilterRo');
  var selectKc = document.getElementById('visitFilterKc');
  if (!selectRo || !selectKc) return;
  var selectedRo = String(selectRo.value || '').trim();
  var kcByRo = dashboardFiltersCache.kc_by_ro || {};
  var prevKc = selectKc.value;
  selectKc.innerHTML = '<option value="">-- Semua KC Supervisi --</option>';
  var kcList = [];
  if (selectedRo && kcByRo[selectedRo]) kcList = Object.keys(kcByRo[selectedRo]).sort();
  else kcList = (dashboardFiltersCache.kc_supervisi || []).slice().sort();
  kcList.forEach(function(kc) { selectKc.innerHTML += '<option value="' + kc + '">' + kc + '</option>'; });
  if (prevKc && kcList.indexOf(prevKc) !== -1) selectKc.value = prevKc;
  else selectKc.value = '';
}

function onVisitRoFilterChange() { updateKcByRoVisit(); applyClientFilters(); }

function startRealTimeAutoRefresh() {
  stopRealTimeAutoRefresh();
  realTimeTimer = setInterval(function() {
    if (currentActiveVendor && !isFetchingRealtime) loadVendorData(currentActiveVendor, true);
  }, 60000);
}

function stopRealTimeAutoRefresh() {
  if (realTimeTimer) { clearInterval(realTimeTimer); realTimeTimer = null; }
}

function applyClientFilters() {
  var targetKlCro = document.getElementById('filterKlCro')?.value.trim().toLowerCase() || '';
  var targetStatus = document.getElementById('filterStatus')?.value || '';
  var elRo = document.getElementById('visitFilterRo');
  var elKc = document.getElementById('visitFilterKc');
  var targetRo = elRo ? elRo.value.trim().toLowerCase() : '';
  var targetKc = elKc ? elKc.value.trim().toLowerCase() : '';

  filteredVisitData = [];
  var countSudah = 0, countBelum = 0;

  serverRawVisitData.forEach(function(row) {
    if (targetKlCro && String(row.kl_cro || '').trim().toLowerCase() !== targetKlCro) return;
    if (targetStatus && row.status !== targetStatus) return;
    if (targetRo) {
      var rowRo = String(row.regional_office || row.ro || '').trim().toLowerCase();
      if (rowRo !== targetRo) return;
    }
    if (targetKc) {
      var rowKc = String(row.kc_supervisi || '').trim().toLowerCase();
      if (rowKc !== targetKc) return;
    }
    filteredVisitData.push(row);
    if (row.status === 'SUDAH') countSudah++;
    else if (row.status === 'BELUM') countBelum++;
  });

  document.getElementById('summaryTotalFiltered').textContent = filteredVisitData.length;
  document.getElementById('summaryTotalSudah').textContent = countSudah;
  document.getElementById('summaryTotalBelum').textContent = countBelum;
  document.getElementById('tableTitleLabel').innerHTML = '<i class="fas fa-list-check me-2 text-success"></i>Tabel Laporan Kunjungan Kelolaan';
  document.getElementById('totalRowCountLabel').textContent = serverRawVisitData.length;
  currentPage = 1;
  renderTablePage();
}

function getColClass(col) {
  if (col.type === 'photo') return 'col-photo';
  if (col.type === 'problem') return 'col-problem';
  if (col.type === 'index') return 'col-no';
  if (col.type === 'status') return 'col-status';
  switch (col.key) {
    case 'timestamp': return 'col-timestamp';
    case 'terminal_id': return 'col-tid';
    case 'ro':
    case 'regional_office': return 'col-ro';
    case 'kc_supervisi': return 'col-kc';
    case 'kl_cro': return 'col-klcro';
    case 'lokasi': return 'col-lokasi';
    case 'jenis_ech': return 'col-jenis-ech';
    case 'status_ech': return 'col-status-ech';
    case 'nilai': return 'col-nilai';
    default: return '';
  }
}

function renderTablePage() {
  var tbody = document.getElementById('visitTableBody');
  var thead = document.getElementById('visitTableHeader');
  var columns = getColumnsForLevel(currentUserLevel);
  var totalCols = columns.length;

  if (thead) {
    var h = '';
    columns.forEach(function(col){ h += '<th class="' + getColClass(col) + '">' + col.label + '</th>'; });
    thead.innerHTML = h;
  }

  var totalItems = filteredVisitData.length;
  if (totalItems === 0) {
    tbody.innerHTML = '<tr><td colspan="' + totalCols + '" class="py-4 text-muted">Tidak ada data kunjungan yang cocok dengan kriteria filter.</td></tr>';
    document.getElementById('visibleRowCountLabel').textContent = 0;
    renderPaginationControls(0);
    return;
  }

  var startIndex = (currentPage - 1) * rowsPerPage;
  var endIndex = Math.min(startIndex + rowsPerPage, totalItems);
  var pageItems = filteredVisitData.slice(startIndex, endIndex);

  var html = '';
  pageItems.forEach(function(row, idx) {
    var globalIndex = startIndex + idx + 1;
    html += '<tr>';
    columns.forEach(function(col) {
      var val = ''; var cls = getColClass(col);
      switch (col.type) {
        case 'index': val = globalIndex; break;
        case 'text': val = (row[col.key] || '-'); break;
        case 'text-bold': val = '<span class="fw-bold text-primary">' + (row[col.key] || '-') + '</span>'; break;
        case 'text-left': val = '<span class="text-start d-block">' + (row[col.key] || '-') + '</span>'; break;
        case 'problem':
          if (row.status === 'SUDAH') {
            val = row.problem && row.problem !== '-' ? '<span class="badge bg-danger text-wrap text-start">' + row.problem + '</span>' : '<span class="text-success"><i class="fas fa-check-circle"></i> Normal</span>';
          } else val = '-';
          val = '<span class="text-start d-block" style="max-width:480px;">' + val + '</span>';
          break;
        case 'photo':
          var photoName = row[col.key]; var cellId = 'thumb_' + col.key + '_' + globalIndex;
          val = formatPhotoCell(photoName, cellId);
          break;
        case 'status':
          val = row.status === 'SUDAH' ? '<span class="badge-sudah"><i class="fas fa-check me-1"></i> SUDAH</span>' : '<span class="badge-belum"><i class="fas fa-clock me-1"></i> BELUM</span>';
          break;
        default: val = (row[col.key] || '-');
      }
      html += '<td class="' + cls + '">' + val + '</td>';
    });
    html += '</tr>';
  });
  tbody.innerHTML = html;
  document.getElementById('visibleRowCountLabel').textContent = pageItems.length;
  renderPaginationControls(totalItems);
}

function renderPaginationControls(totalItems) {
  var totalPages = Math.ceil(totalItems / rowsPerPage);
  var container = document.getElementById('paginationControls');
  if (!container) return;
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  var html = '';
  html += '<li class="page-item ' + (currentPage === 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="changePage(' + (currentPage - 1) + '); return false;">&laquo; Prev</a></li>';
  for (var p = 1; p <= totalPages; p++) {
    html += '<li class="page-item ' + (p === currentPage ? 'active' : '') + '"><a class="page-link" href="#" onclick="changePage(' + p + '); return false;">' + p + '</a></li>';
  }
  html += '<li class="page-item ' + (currentPage === totalPages ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="changePage(' + (currentPage + 1) + '); return false;">Next &raquo;</a></li>';
  container.innerHTML = html;
}

function changePage(page) {
  var totalPages = Math.ceil(filteredVisitData.length / rowsPerPage);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTablePage();
}

function formatPhotoCell(photoName, cellId) {
  if (!photoName || photoName === '-') return '-';
  setTimeout(function(){ loadCellThumbnail(photoName, cellId); }, 100);
  return '<div id="' + cellId + '" class="text-center"><span class="spinner-border spinner-border-sm text-secondary" role="status"></span></div>';
}

function loadCellThumbnail(photoName, cellId) {
  var container = document.getElementById(cellId);
  if (!container) return;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success && res.photo) {
        var p = res.photo;
        var src = "data:" + p.mimeType + ";base64," + p.base64;
        var escapedName = photoName.replace(/'/g, "\\'");
        container.innerHTML = '<img src="' + src + '" class="img-thumbnail table-photo-thumb shadow-sm" alt="Thumbnail" onclick="previewPhotoModal(\'' + escapedName + '\')" title="Klik untuk memperbesar">';
      } else {
        container.innerHTML = '<button class="btn btn-sm btn-outline-danger" onclick="previewPhotoModal(\'' + photoName + '\')"><i class="fas fa-exclamation-triangle"></i> Cek Foto</button>';
      }
    })
    .withFailureHandler(function(){ if (container) container.innerHTML = '-'; })
    .getSinglePhotoData(photoName);
}

function previewPhotoModal(photoName) {
  if (!photoName || photoName === '-') return;
  var modalEl = document.getElementById('photoPreviewModal');
  var imgEl = document.getElementById('photoPreviewImg');
  var titleEl = document.getElementById('photoPreviewTitle');
  if (!modalEl || !imgEl) return;
  titleEl.innerHTML = '<i class="fas fa-image me-2"></i>' + photoName;
  imgEl.src = '';
  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent = "Mengambil pratinjau foto HD...";
  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (res && res.success && res.photo) {
        var p = res.photo;
        imgEl.src = "data:" + p.mimeType + ";base64," + p.base64;
        bootstrap.Modal.getOrCreateInstance(modalEl).show();
      } else showToast('danger', '❌ Foto tidak ditemukan.');
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      showToast('danger', 'Error memuat foto: ' + err.message);
    })
    .getSinglePhotoData(photoName);
}

function exportTableToExcel() {
  if (!filteredVisitData || filteredVisitData.length === 0) { showToast('warning', 'Tidak ada data kunjungan yang dapat diekspor.'); return; }
  var columns = getColumnsForLevel(currentUserLevel);
  var headers = columns.map(function(c){ return c.label; });
  var excelHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body><table border="1" style="border-collapse:collapse;">';
  excelHtml += '<tr style="background-color:#1a3a6a; color:#ffffff; font-weight:bold; text-align:center;">';
  headers.forEach(function(h){ excelHtml += '<th style="padding:8px;">' + h + '</th>'; });
  excelHtml += '</tr>';
  var cellStyle = 'text-align:center; vertical-align:middle; padding:6px;';
  filteredVisitData.forEach(function(row, idx) {
    excelHtml += '<tr style="text-align:center;">';
    columns.forEach(function(col) {
      var val = '';
      switch (col.type) {
        case 'index': val = (idx + 1); break;
        case 'problem': val = (row.status === 'SUDAH' ? (row.problem || '-') : '-'); break;
        case 'photo': val = (row[col.key] || '-'); break;
        case 'status': val = (row.status || '-'); break;
        default: val = (row[col.key] || '-');
      }
      excelHtml += '<td style="' + cellStyle + '">' + String(val) + '</td>';
    });
    excelHtml += '</tr>';
  });
  excelHtml += '</table></body></html>';
  var blob = new Blob([excelHtml], { type: "application/vnd.ms-excel;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var formattedDate = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "LAPORAN_KUNJUNGAN_" + formattedDate + ".xls";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('success', '📥 ' + filteredVisitData.length + ' data berhasil diekspor!');
}

function loadDashboardData(forceReload) {
  if (!currentActiveVendor) return;
  var dashFilterMonth = document.getElementById('dashFilterMonth');
  var dashFilterYear  = document.getElementById('dashFilterYear');
  var now = new Date();
  if (dashFilterMonth && !dashFilterMonth.value) dashFilterMonth.value = String(now.getMonth() + 1);
  if (dashFilterYear  && !dashFilterYear.value)  dashFilterYear.value  = String(now.getFullYear());
  var month = dashFilterMonth ? dashFilterMonth.value : '';
  var year  = dashFilterYear  ? dashFilterYear.value  : '';
  var cacheValid = !forceReload && dashboardCache.raw && dashboardCache.month === month && dashboardCache.year === year && dashboardCache.userLevel === currentUserLevel;
  if (cacheValid) { applyDashboardData(dashboardCache.raw); return; }
  var ro = document.getElementById('dashFilterRo') ? document.getElementById('dashFilterRo').value : '';
  var kc = document.getElementById('dashFilterKc') ? document.getElementById('dashFilterKc').value : '';
  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent = "Memuat data Dashboard...";
  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (!res.success) { showToast('danger', 'Gagal memuat dashboard: ' + res.message); return; }
      dashboardCache.raw = res; dashboardCache.month = month; dashboardCache.year = year; dashboardCache.userLevel = currentUserLevel;
      applyDashboardData(res);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      showToast('danger', 'Error sistem: ' + err.message);
    })
    .getDashboardData(currentActiveVendor, currentUserLevel, month, year, ro, kc);
}

function setupDashboardFilters(userLevel, filters) {
  var cFilterRo = document.getElementById('containerFilterRo');
  var cSelectRo = document.getElementById('containerSelectRo');
  var cFilterKc = document.getElementById('containerFilterKc');
  var cSelectKc = document.getElementById('containerSelectKc');
  var selectRo = document.getElementById('dashFilterRo');
  var selectKc = document.getElementById('dashFilterKc');

  dashboardFiltersCache.regional_office = filters.regional_office || [];
  dashboardFiltersCache.kc_supervisi = filters.kc_supervisi || [];
  
  var kcByRo = {};
  (serverRawVisitData || []).forEach(function(row) {
    var roRow = String(row.regional_office || row.ro || '').trim();
    var kcRow = String(row.kc_supervisi || '').trim();
    if (roRow && roRow !== '-' && kcRow && kcRow !== '-') {
      if (!kcByRo[roRow]) kcByRo[roRow] = {};
      kcByRo[roRow][kcRow] = true;
    }
  });
  dashboardFiltersCache.kc_by_ro = kcByRo;

  // Default: Sembunyikan semua filter RO & KC
  if (cFilterRo) cFilterRo.classList.add('d-none');
  if (cSelectRo) cSelectRo.classList.add('d-none');
  if (cFilterKc) cFilterKc.classList.add('d-none');
  if (cSelectKc) cSelectKc.classList.add('d-none');

  // Untuk Level RO (Hanya Tampilkan KC)
  if (userLevel === 'RO') {
    if (cFilterKc) cFilterKc.classList.remove('d-none');
    if (cSelectKc) {
      cSelectKc.classList.remove('d-none');
      var prevKc = selectKc.value;
      selectKc.innerHTML = '<option value="">-- Semua KC Supervisi --</option>';
      (filters.kc_supervisi || []).forEach(function(kc) { 
        selectKc.innerHTML += '<option value="' + kc + '">' + kc + '</option>'; 
      });
      if (prevKc) selectKc.value = prevKc;
    }
  } 
  // Untuk Level HO (Tampilkan RO & KC)
  else if (userLevel === 'HO' || userLevel === 'HEAD OFFICE') {
    if (cFilterRo) cFilterRo.classList.remove('d-none');
    if (cSelectRo) {
      cSelectRo.classList.remove('d-none');
      var prevRo = selectRo.value;
      selectRo.innerHTML = '<option value="">-- Semua Regional Office --</option>';
      (filters.regional_office || []).forEach(function(ro) { 
        selectRo.innerHTML += '<option value="' + ro + '">' + ro + '</option>'; 
      });
      if (prevRo) selectRo.value = prevRo;
    }
    
    if (cFilterKc) cFilterKc.classList.remove('d-none');
    if (cSelectKc) {
      cSelectKc.classList.remove('d-none');
      var selectedRo = selectRo.value;
      var prevKc2 = selectKc.value;
      selectKc.innerHTML = '<option value="">-- Semua KC Supervisi --</option>';
      var kcList = [];
      if (selectedRo && kcByRo[selectedRo]) kcList = Object.keys(kcByRo[selectedRo]).sort();
      else kcList = (filters.kc_supervisi || []).slice().sort();
      kcList.forEach(function(kc) { 
        selectKc.innerHTML += '<option value="' + kc + '">' + kc + '</option>'; 
      });
      if (prevKc2 && kcList.indexOf(prevKc2) !== -1) selectKc.value = prevKc2;
    }
  }
  // Note: Untuk CRO & KL, filter RO & KC otomatis disembunyikan (sesuai baris default di atas)
}

function onRoFilterChange() {

function loadKelolaanData(forceReload) {
  if (!currentActiveVendor) return;
  var lv = String(currentUserLevel || '').trim().toUpperCase();
  if (lv === 'HEAD OFFICE') lv = 'HO';
  if (lv !== 'HO') {
    var tbodyGuard = document.getElementById('kelolaanTableBody');
    if (tbodyGuard) tbodyGuard.innerHTML = '<tr><td colspan="11" class="py-5 text-muted fw-bold"><i class="fas fa-lock fa-2x mb-3 d-block text-secondary"></i>Menu Data Kelolaan hanya untuk level Head Office.</td></tr>';
    return;
  }
  if (!forceReload && serverRawKelolaanData && serverRawKelolaanData.length > 0) {
    kelolaanData = serverRawKelolaanData.slice();
    filteredKelolaanData = kelolaanData.slice();
    kelolaanCurrentPage = 1;
    if (editKelolaanCache.roList.length === 0) buildEditKelolaanCache();
    buildTambahKelolaanDropdowns();
    applyKelolaanMetaInfo();
    switchKelolaanSubMenu('edit');
    return;
  }
  var tbody = document.getElementById('kelolaanTableBody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="11" class="py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data kelolaan...</td></tr>';
  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent = 'Memuat data kelolaan...';
  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (!res.success) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="11" class="text-danger py-3">Gagal: ' + res.message + '</td></tr>';
        return;
      }
      serverRawKelolaanData = res.data || [];
      buildEditKelolaanCache();
      buildTambahKelolaanDropdowns();
      kelolaanData = serverRawKelolaanData.slice();
      filteredKelolaanData = kelolaanData.slice();
      kelolaanCurrentPage = 1;
      var searchInput = document.getElementById('kelolaanSearchTid');
      if (searchInput) searchInput.value = '';
      applyKelolaanMetaInfo();
      switchKelolaanSubMenu('edit');
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (tbody) tbody.innerHTML = '<tr><td colspan="11" class="text-danger py-3">Error: ' + err.message + '</td></tr>';
    })
    .getKelolaanData(currentActiveVendor, currentUserLevel);
}

function applyKelolaanMetaInfo() {

}

function renderKelolaanTablePage() {
  var tbody = document.getElementById('kelolaanTableBody');
  if (!tbody) return;

  if ((!serverRawKelolaanData || serverRawKelolaanData.length === 0) && (!kelolaanData || kelolaanData.length === 0)) {
    tbody.innerHTML = '<tr><td colspan="11" class="py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data kelolaan dari server...</td></tr>';
    return;
  }

  var totalItems = filteredKelolaanData.length;
  if (totalItems === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="py-4 text-muted"><i class="fas fa-info-circle me-1"></i> Belum ada data kelolaan. Silakan tambah data terlebih dahulu.</td></tr>';
    var visEl = document.getElementById('kelolaanVisibleRowCount'); if (visEl) visEl.textContent = '0';
    var totEl = document.getElementById('kelolaanTotalRowCount'); if (totEl) totEl.textContent = '0';
    renderKelolaanPaginationControls(0);
    return;
  }
  var startIndex = (kelolaanCurrentPage - 1) * kelolaanRowsPerPage;
  var endIndex = Math.min(startIndex + kelolaanRowsPerPage, totalItems);
  var pageItems = filteredKelolaanData.slice(startIndex, endIndex);
  var html = '';
  pageItems.forEach(function(row, idx) {
    var globalNo = startIndex + idx + 1;
    var editBtn = '<button class="btn btn-sm btn-warning fw-bold" onclick="openEditKelolaanModal(' + row.row_index + ')" title="Edit"><i class="fas fa-pen"></i> Edit</button>';
    html += '<tr>';
    html += '<td>' + globalNo + '</td>';
    html += '<td><span class="fw-bold text-primary">' + (row.terminal_id || '-') + '</span></td>';
    html += '<td>' + (row.regional_office || '-') + '</td>';
    html += '<td>' + (row.ro || '-') + '</td>';
    html += '<td>' + (row.kc_supervisi || '-') + '</td>';
    html += '<td class="text-start">' + (row.lokasi || '-') + '</td>';
    html += '<td>' + (row.jenis_ech || '-') + '</td>';
    html += '<td>' + (row.status_ech || '-') + '</td>';
    html += '<td>' + (row.kelolaan || '-') + '</td>';
    html += '<td>' + (row.kl_cro || '-') + '</td>';
    html += '<td>' + editBtn + '</td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
  var visEl = document.getElementById('kelolaanVisibleRowCount'); if (visEl) visEl.textContent = pageItems.length;
  var totEl = document.getElementById('kelolaanTotalRowCount'); if (totEl) totEl.textContent = totalItems;
  renderKelolaanPaginationControls(totalItems);
}

function renderKelolaanPaginationControls(totalItems) {
  var totalPages = Math.ceil(totalItems / kelolaanRowsPerPage);
  var container = document.getElementById('kelolaanPaginationControls');
  if (!container) return;
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  var html = '<li class="page-item ' + (kelolaanCurrentPage === 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="changeKelolaanPage(' + (kelolaanCurrentPage - 1) + '); return false;">&laquo;</a></li>';
  for (var p = 1; p <= totalPages; p++) {
    html += '<li class="page-item ' + (p === kelolaanCurrentPage ? 'active' : '') + '"><a class="page-link" href="#" onclick="changeKelolaanPage(' + p + '); return false;">' + p + '</a></li>';
  }
  html += '<li class="page-item ' + (kelolaanCurrentPage === totalPages ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="changeKelolaanPage(' + (kelolaanCurrentPage + 1) + '); return false;">&raquo;</a></li>';
  container.innerHTML = html;
}

function changeKelolaanPage(page) {
  var totalPages = Math.ceil(filteredKelolaanData.length / kelolaanRowsPerPage);
  if (page < 1 || page > totalPages) return;
  kelolaanCurrentPage = page;
  renderKelolaanTablePage();
}

function buildEditKelolaanCache() {
  var cache = { roList: [], kcByRo: {}, boByKc: {}, kelolaanList: [], klCroByKelolaan: {}, roCodeByRegionalOffice: {} };
  var roSet = {}, kelolaanSet = {};
  (serverRawKelolaanData || []).forEach(function(row) {
    var roName = String(row.regional_office || '').trim();
    var roCode = String(row.ro || '').trim();
    var kc = String(row.kc_supervisi || '').trim();
    var bo = String(row.bo || '').trim();
    var kelolaan = String(row.kelolaan || '').trim();
    var klCro = String(row.kl_cro || '').trim();
    if (roName && roName !== '-') roSet[roName] = true;
    if (roName && roName !== '-' && roCode && roCode !== '-') { if (!cache.roCodeByRegionalOffice[roName]) cache.roCodeByRegionalOffice[roName] = roCode; }
    if (roName && roName !== '-' && kc && kc !== '-') { if (!cache.kcByRo[roName]) cache.kcByRo[roName] = {}; cache.kcByRo[roName][kc] = true; }
    if (kc && kc !== '-' && bo && bo !== '-') cache.boByKc[kc] = bo;
    if (kelolaan && kelolaan !== '-') kelolaanSet[kelolaan] = true;
    if (kelolaan && kelolaan !== '-' && klCro && klCro !== '-') { if (!cache.klCroByKelolaan[kelolaan]) cache.klCroByKelolaan[kelolaan] = {}; cache.klCroByKelolaan[kelolaan][klCro] = true; }
  });
  cache.roList = Object.keys(roSet).sort();
  cache.kelolaanList = Object.keys(kelolaanSet).sort();
  Object.keys(cache.kcByRo).forEach(function(ro) { cache.kcByRo[ro] = Object.keys(cache.kcByRo[ro]).sort(); });
  Object.keys(cache.klCroByKelolaan).forEach(function(k) { cache.klCroByKelolaan[k] = Object.keys(cache.klCroByKelolaan[k]).sort(); });
  editKelolaanCache = cache;
}

function buildTambahKelolaanDropdowns() {
  if (typeof editKelolaanCache === 'undefined' ||
      !editKelolaanCache ||
      !Array.isArray(editKelolaanCache.roList)) {
    console.error('Cache Data Kelolaan belum tersedia.');
    return;
  }

  if (editKelolaanCache.roList.length === 0 &&
      typeof buildEditKelolaanCache === 'function') {
    buildEditKelolaanCache();
  }

  var selectRo = document.getElementById('addRo');
  if (selectRo) {
    var prevRo = selectRo.value;
    selectRo.innerHTML = '<option value="">-- Pilih Regional Office --</option>';
    editKelolaanCache.roList.forEach(function(ro) {
      var opt = document.createElement('option');
      opt.value = ro;
      opt.textContent = ro;
      selectRo.appendChild(opt);
    });
    if (prevRo && editKelolaanCache.roList.indexOf(prevRo) !== -1) {
      selectRo.value = prevRo;
    }
  }

  var selectKelolaan = document.getElementById('addKelolaan');
  if (selectKelolaan) {
    var prevKelolaan = selectKelolaan.value;
    selectKelolaan.innerHTML = '<option value="">-- Pilih Kelolaan --</option>';
    (editKelolaanCache.kelolaanList || []).forEach(function(k) {
      var opt = document.createElement('option');
      opt.value = k;
      opt.textContent = k;
      selectKelolaan.appendChild(opt);
    });
    if (prevKelolaan &&
        editKelolaanCache.kelolaanList.indexOf(prevKelolaan) !== -1) {
      selectKelolaan.value = prevKelolaan;
    }
  }

  var selectKc = document.getElementById('addKcSupervisi');
  if (selectKc) {
    var prevKc = selectKc.value;
    selectKc.innerHTML = '<option value="">-- Pilih KC Supervisi --</option>';
    var allKc = {};
    Object.keys(editKelolaanCache.kcByRo || {}).forEach(function(ro) {
      (editKelolaanCache.kcByRo[ro] || []).forEach(function(kc) {
        allKc[kc] = true;
      });
    });
    Object.keys(allKc).sort().forEach(function(kc) {
      var opt = document.createElement('option');
      opt.value = kc;
      opt.textContent = kc;
      selectKc.appendChild(opt);
    });
    if (prevKc && allKc[prevKc]) {
      selectKc.value = prevKc;
    }
  }
}

function preloadKelolaanCache() {
  if (!currentActiveVendor) return;
  var lv = String(currentUserLevel || '').trim().toUpperCase();
  if (lv === 'HEAD OFFICE') lv = 'HO';
  if (lv !== 'HO') return;

  if (serverRawKelolaanData && serverRawKelolaanData.length > 0) {
    if (editKelolaanCache.roList.length === 0) { buildEditKelolaanCache(); buildTambahKelolaanDropdowns(); }
    return;
  }
  isPreloadingKelolaan = true;
  google.script.run
    .withSuccessHandler(function(res) {
      isPreloadingKelolaan = false;
      if (res && res.success) {
        serverRawKelolaanData = res.data || [];
        kelolaanData = serverRawKelolaanData.slice();
        filteredKelolaanData = kelolaanData.slice();
        kelolaanCurrentPage = 1;
        buildEditKelolaanCache();
        buildTambahKelolaanDropdowns();

        var kelolaanView = document.getElementById('kelolaanView');
        if (kelolaanView && !kelolaanView.classList.contains('d-none')) {
          applyKelolaanMetaInfo();
          renderKelolaanTablePage();
        }
      }
    })
    .withFailureHandler(function(err) { isPreloadingKelolaan = false; })
    .getKelolaanData(currentActiveVendor, currentUserLevel);
}

function purgeKelolaanCache() {
  serverRawKelolaanData = []; kelolaanData = []; filteredKelolaanData = []; kelolaanCurrentPage = 1;

function downloadCsvData() {
  var lv = String(currentUserLevel || '').trim().toUpperCase();

  if (lv !== 'HO') { showToast('danger', 'Menu ini hanya untuk Head Office.'); return; }

  var singleDate = dateInput ? dateInput.value : '';

  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('loadingText').textContent = 'Mengambil data CSV...';
  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (!res || !res.success) {
        if (info) info.innerHTML = '<div class="alert alert-danger py-2 mb-0">❌ ' + ((res && res.message) ? res.message : 'Gagal.') + '</div>';
        return;
      }
      var headers = res.headers || []; var rows = res.rows || [];
      if (rows.length === 0) {
        if (info) info.innerHTML = '<div class="alert alert-warning py-2 mb-0">⚠️ Tidak ada data.</div>';
        return;
      }
      var csvContent = '';
      csvContent += headers.map(function(h) { return csvEscape(h); }).join(';') + '\r\n';
      rows.forEach(function(row) { csvContent += row.map(function(cell) { return csvEscape(cell); }).join(';') + '\r\n'; });
      var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var formattedDate = singleDate ? singleDate : new Date().toISOString().slice(0, 10);
      a.href = url; a.download = 'RESPONSES_' + formattedDate + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
      if (info) info.innerHTML = '<div class="alert alert-success py-2 mb-0">✅ Berhasil mengunduh <b>' + rows.length + '</b> baris.</div>';
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (info) info.innerHTML = '<div class="alert alert-danger py-2 mb-0">❌ Error: ' + err.message + '</div>';
    })
    .getExportResponsesData(singleDate);
}

function csvEscape(value) {
  var str = String(value === null || value === undefined ? '' : value);
  if (str.indexOf(';') !== -1 || str.indexOf('"') !== -1 || str.indexOf('\n') !== -1 || str.indexOf('\r') !== -1) {
    str = '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

var ZIP_MAX_SIZE_BYTES = 5 * 1024 * 1024;
var ZIP_OVERHEAD = 150 * 1024;
var BATCH_DELAY_MS = 300;

function downloadFotoZip() {
  var lv = String(currentUserLevel || '').trim().toUpperCase();

    })
    .withFailureHandler(function(err) {

    })

function fetchPhotosSequentially(photos, singleDate, info) {
  var loadedPhotos = [];
  var totalPhotos = photos.length;
  var currentIdx = 0;
  var failedCount = 0;

  function updateProgress() {
    if (!info) return;
    var pct = Math.round((currentIdx / totalPhotos) * 100);
    info.innerHTML = '<div class="alert alert-info py-2 mb-0"><span class="spinner-border spinner-border-sm me-2"></span>Mengambil foto <b>' + currentIdx + '</b> / <b>' + totalPhotos + '</b> (' + pct + '%)<div class="progress mt-2" style="height:6px;"><div class="progress-bar bg-primary" style="width:' + pct + '%"></div></div></div>';
  }

  function fetchNext() {
    if (currentIdx >= totalPhotos) {
      if (info) info.innerHTML = '<div class="alert alert-info py-2 mb-0"><span class="spinner-border spinner-border-sm me-2"></span>Membuat ZIP...</div>';
      setTimeout(function() { buildMultipleZipFilesV2(loadedPhotos, singleDate, info, failedCount); }, 200);
      return;
    }
    var photoMeta = photos[currentIdx]; currentIdx++;
    updateProgress();
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.base64) {
          loadedPhotos.push({ name: res.name || photoMeta.name, base64: res.base64, size: res.size || photoMeta.size, mimeType: res.mimeType || photoMeta.mimeType });
        } else failedCount++;
        setTimeout(fetchNext, BATCH_DELAY_MS);
      })
      .withFailureHandler(function(err) { failedCount++; setTimeout(fetchNext, BATCH_DELAY_MS); })
      .getPhotoBase64ById(photoMeta.id);
  }
  fetchNext();
}

function buildMultipleZipFilesV2(photos, singleDate, info, failedCount) {
  if (!photos || photos.length === 0) {
    document.getElementById('loadingOverlay').classList.remove('show');
    if (info) info.innerHTML = '<div class="alert alert-danger py-2 mb-0">❌ Tidak ada foto.</div>';
    return;
  }
  var zipGroups = [], currentZip = new JSZip(), currentSize = 0, currentCount = 0, groupIndex = 1;
  photos.forEach(function(photo) {
    var estSize = Math.ceil((photo.size || 0) * 0.98);
    if (currentCount > 0 && (currentSize + estSize + ZIP_OVERHEAD) > ZIP_MAX_SIZE_BYTES) {
      zipGroups.push({ zip: currentZip, count: currentCount, index: groupIndex });
      groupIndex++; currentZip = new JSZip(); currentSize = 0; currentCount = 0;
    }
    try { currentZip.file(photo.name, photo.base64, { base64: true }); currentSize += estSize; currentCount++; } catch (e) {}
  });
  if (currentCount > 0) zipGroups.push({ zip: currentZip, count: currentCount, index: groupIndex });
  if (zipGroups.length === 0) { document.getElementById('loadingOverlay').classList.remove('show'); return; }
  var baseName = singleDate ? singleDate : new Date().toISOString().slice(0, 10);

  function generateNext(idx) {
    if (idx >= zipGroups.length) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (info) info.innerHTML = '<div class="alert alert-success py-2 mb-0">✅ Berhasil membuat <b>' + zipGroups.length + '</b> file ZIP dari <b>' + photos.length + '</b> foto.</div>';
      return;
    }
    var group = zipGroups[idx];
    var fileName = zipGroups.length === 1 ? 'FOTO_' + baseName + '.zip' : 'FOTO_' + baseName + '_PART' + group.index + '.zip';
    if (info) info.innerHTML = '<div class="alert alert-info py-2 mb-0"><span class="spinner-border spinner-border-sm me-2"></span>Membuat ZIP ' + (idx + 1) + ' dari ' + zipGroups.length + '...</div>';
    group.zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } }).then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 3000);
      setTimeout(function() { generateNext(idx + 1); }, 800);
    }).catch(function(err) {
      document.getElementById('loadingOverlay').classList.remove('show');
      if (info) info.innerHTML = '<div class="alert alert-danger py-2 mb-0">❌ Gagal membuat ZIP: ' + err.message + '</div>';
    });
  }
  generateNext(0);
}

function updateSurveyProgressBar() {
  var pb = document.getElementById('surveyProgressBar');
  var pt = document.getElementById('progressBarText');
  if (!pb || !pt) return;
  if (currentQuestion === 'end' || currentQuestion === 'submit') {
    pb.style.width = '100%';
    pb.classList.remove('bg-primary'); pb.classList.add('bg-success');
    pt.textContent = '100% (Selesai)';
    return;
  }
  var completedSteps = flowHistory.length;
  var remaining = calculateRemainingSteps(currentQuestion);
  var total = Math.max(completedSteps + remaining, 1);
  var pct = Math.round((completedSteps / total) * 100);
  pct = Math.min(Math.max(pct, 0), 98);
  pb.style.width = pct + '%';
  pb.classList.remove('bg-success'); pb.classList.add('bg-primary');
  pt.textContent = pct + '% (' + completedSteps + '/' + total + ')';
}

function calculateRemainingSteps(startQid) {
  var count = 0, current = startQid, visited = new Set();
  while (current && current !== 'end' && !visited.has(current)) {
    visited.add(current); count++;
    var q = flowQuestions[current]; if (!q) break;
    if (typeof q.next === 'string') current = q.next;
    else if (typeof q.next === 'object') { var k = Object.keys(q.next); current = q.next[k[0]] || q.next.default; }
    else if (typeof q.next === 'function') current = q.next(flowAnswers);
    else break;
  }
  return count;
}

function flowPrev() {
  if (document.activeElement) document.activeElement.blur();
  if (flowHistory.length > 0) {
    var prev = flowHistory.pop();
    currentQuestion = prev;
    window.history.pushState({ qid: prev }, null, window.location.href);
    renderFlowQuestion(prev);
    var fm = document.getElementById('flowMessage'); if (fm) fm.innerHTML = '';
  }
}

function flowReset() {
  if (!confirm("Apakah yakin ingin mengulang survey?")) return;
  if (document.activeElement) document.activeElement.blur();
  clearSurveyMemory();
  currentQuestion = 'start';
  var fm = document.getElementById('flowMessage'); if (fm) fm.innerHTML = '';
  renderFlowQuestion('start');
}

function determineNext(qid, answer) {
  var q = flowQuestions[qid];
  var nextId;
  if (typeof q.next === 'function') nextId = q.next(flowAnswers);
  else if (typeof q.next === 'object') nextId = q.next[answer] || q.next.default;
  else nextId = q.next;
  if (nextId) {
    currentQuestion = nextId;
    window.history.pushState({ qid: nextId }, null, window.location.href);
    renderFlowQuestion(nextId);
  }
}

function flowAnswer(qid, answer) {
  if (document.activeElement) document.activeElement.blur();
  flowAnswers[qid] = answer;
  if (flowHistory[flowHistory.length - 1] !== qid) flowHistory.push(qid);
  updateSurveyProgressBar();
  determineNext(qid, answer);
}

function flowValueAnswer(qid) {
  var input = document.getElementById('flowTextInput');
  var value = input ? input.value.trim() : '';
  if (!value) { showToast('warning', 'Nilai tidak boleh kosong'); return; }
  if (isNaN(value)) { showToast('danger', 'Format angka salah'); return; }
  if (input) input.blur();
  flowAnswers[qid] = parseFloat(value).toFixed(2);
  if (flowHistory[flowHistory.length - 1] !== qid) flowHistory.push(qid);
  updateSurveyProgressBar();
  setTimeout(function(){ determineNext(qid, flowAnswers[qid]); }, 150);
}

function flowTextAnswer(qid) {
  var input = document.getElementById('flowTextInput');
  var value = input ? input.value.trim() : '';
  if (!value && qid !== 'qhal') { showToast('warning', 'Kolom tidak boleh dikosongkan.'); return; }
  if (input) input.blur();
  if (qid === 'qtid') {
    document.getElementById('loadingOverlay').classList.add('show');
    document.getElementById('loadingText').textContent = "Memvalidasi TID...";
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('loadingOverlay').classList.remove('show');
        if (!result.valid) {
          showToast('danger', '❌ Terminal ID tidak ditemukan!');
          var rd = document.getElementById('flowVerifyResult');
          if (rd) rd.innerHTML = '<div class="alert alert-danger shadow-sm mt-2">TID <b>' + value + '</b> salah atau tidak terdaftar.</div>';
          return;
        }
        showToast('success', 'TID Cocok & Terverifikasi');
        flowAnswers[qid] = value;
        if (flowHistory[flowHistory.length - 1] !== qid) flowHistory.push(qid);
        updateSurveyProgressBar();
        setTimeout(function(){ determineNext(qid, value); }, 150);
      })
      .withFailureHandler(function(err) {
        document.getElementById('loadingOverlay').classList.remove('show');
        showToast('danger', 'Koneksi error: ' + err.message);
      })
      .verifyTid(value);
    return;
  }
  flowAnswers[qid] = value;
  if (flowHistory[flowHistory.length - 1] !== qid) flowHistory.push(qid);
  updateSurveyProgressBar();
  setTimeout(function(){ determineNext(qid, value); }, 150);
}

function clearSurveyMemory() {
  currentBase64Data = null; flowAnswers = {}; flowHistory = []; uploadedFileNames = {};
  document.querySelectorAll('.image-preview').forEach(function(img){
    if (img.src) { if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src); img.src = ''; }
    img.classList.remove('show');
  });
  document.querySelectorAll('input[type=file]').forEach(function(f){ f.value = ''; });
  updateSurveyProgressBar();
}

function flowSubmit() {
  if (document.activeElement) document.activeElement.blur();

  var message = document.getElementById('flowMessage');

  var container = document.getElementById('flowContainer');

    .withSuccessHandler(function(result) {
      overlay.classList.remove('show');

            '<img src="https://lh3.googleusercontent.com/d/16gH6limWfC93ZtImseJtENLZvTgoKVh9" class="img-fluid rounded shadow-sm border" style="max-height: 250px; width: auto;" alt="Sukses Terkirim">' +
            '</div>' +
            '<h3 class="text-success mb-2 fw-bold"><i class="fas fa-check-circle me-2"></i>Data Berhasil Disubmit</h3>' +
            '<p class="text-dark fs-5 mb-1">Terminal ID: <b class="text-primary fs-4">' + submittedTid + '</b></p>' +
            '<p class="text-muted fs-6 mb-4">Terima kasih, data kuesioner Anda telah sukses diverifikasi.</p>' +
            '<button class="btn btn-primary btn-lg px-5 py-3 fw-bold shadow" onclick="finishAndRestartSurvey()">' +
            '<i class="fas fa-check me-2"></i> OK</button>' +

      } else {
        submitBtn.disabled = false;

      }
    })
    .withFailureHandler(function(err) {
      overlay.classList.remove('show');
      submitBtn.disabled = false;
      if (message) message.innerHTML = '<div class="alert alert-danger shadow-sm">Transmisi Gagal: ' + err.message + '</div>';

function finishAndRestartSurvey() {
  clearSurveyMemory();
  currentQuestion = 'start';
  var fm = document.getElementById('flowMessage'); if (fm) fm.innerHTML = '';
  renderFlowQuestion('start');
  updateSurveyProgressBar();
  showToast('info', 'Formulir survey telah disiapkan kembali.');
}

function renderFlowQuestion(qid) {
  if (document.activeElement) document.activeElement.blur();
  var container = document.getElementById('flowContainer');
  if (!container) return;
  var q = flowQuestions[qid];
  if (!q) { container.innerHTML = '<div class="alert alert-danger">Pertanyaan tidak ditemukan.</div>'; return; }
  currentQuestion = qid;
  currentBase64Data = null;
  updateSurveyProgressBar();
  document.querySelectorAll('.image-preview').forEach(function(img){
    if (img.dataset.bloburl) { URL.revokeObjectURL(img.dataset.bloburl); img.dataset.bloburl = ''; }
  });
  if (q.type === 'end') {
    container.innerHTML = '<div class="text-center py-4">' +
      '<h3 class="text-success mb-3"><i class="fas fa-check-circle me-2"></i>Survey Selesai</h3>' +
      '<p class="text-muted fs-6">' + q.text + '</p>' +
      '<div class="action-area">' +
      '<button id="flowSubmitBtn" class="btn btn-success btn-lg btn-lg-hp px-5 py-3 fw-bold shadow" onclick="flowSubmit()">' +
      '<i class="fas fa-paper-plane me-2"></i> KIRIM JAWABAN SURVEY</button>' +
      '</div></div>';
    return;
  }
  var html = '<div class="text-center">';
  if (q.guideImg) {
    html += '<div class="mb-3 text-center"><span class="badge bg-secondary mb-2 px-3 py-2 fs-6"><i class="fas fa-info-circle me-1"></i> Foto Contoh / Panduan:</span><br><img src="' + q.guideImg + '" loading="lazy" decoding="async" class="img-fluid rounded shadow-sm border" style="max-height:250px;width:auto" alt="Panduan"></div>';
  }
  if (q.text) html += '<p class="fw-bold text-primary-dark mb-4">' + q.text + '</p>';
  var opts = typeof q.options === 'function' ? q.options(flowAnswers) : q.options;
  switch (q.type) {
    case 'choice':
      html += '<div class="answer-container">';
      opts.forEach(function(opt){
        var escaped = opt.replace(/'/g, "\\'");
        html += '<button class="btn btn-outline-primary btn-option" onclick="flowAnswer(\'' + qid + '\',\'' + escaped + '\')">' + opt + '</button>';
      });
      html += '</div>';
      break;
    case 'text':
      html += '<div class="vertical-input-container">' +
        '<input type="text" id="flowTextInput" class="form-control w-100 py-3" placeholder="Ketik jawaban di sini..." autocomplete="off" value="' + (flowAnswers[qid] || '') + '">' +
        '<button class="btn btn-success btn-lg-hp px-5 py-2 mt-2 shadow-sm w-100" onclick="flowTextAnswer(\'' + qid + '\')">' +
        (q.verify ? '<i class="fas fa-search me-1"></i> Verifikasi & Lanjut' : 'Lanjut <i class="fas fa-arrow-right ms-1"></i>') +
        '</button><div id="flowVerifyResult" class="mt-2"></div></div>';
      break;
    case 'number':
      html += '<div class="vertical-input-container">' +
        '<input type="text" id="flowTextInput" inputmode="decimal" autocomplete="off" class="form-control w-100 py-3" placeholder="Masukkan angka" value="' + (flowAnswers[qid] || '') + '" oninput="validateNumericInput(this)">' +
        '<button class="btn btn-success btn-lg-hp px-5 py-2 mt-2 shadow-sm w-100" onclick="flowValueAnswer(\'' + qid + '\')">Lanjut <i class="fas fa-arrow-right ms-1"></i></button>' +
        '</div>';
      break;
    case 'file':
      html += '<div class="vertical-input-container">' +
        '<input type="file" id="flowFileInput_' + qid + '" class="form-control d-none" accept="image/*" onchange="previewAndPrepareImage(this,\'' + qid + '\')">' +
        '<div class="btn-upload-group row-mode">' +
        '<button type="button" class="btn btn-camera btn-lg-hp px-4 py-3 shadow-sm w-100 w-sm-50" onclick="triggerCameraOnly(\'' + qid + '\')"><i class="fas fa-camera fa-lg me-2"></i> Buka Kamera</button>' +
        '<button type="button" class="btn btn-gallery btn-lg-hp px-4 py-3 shadow-sm w-100 w-sm-50" onclick="triggerGalleryOnly(\'' + qid + '\')"><i class="fas fa-folder-open fa-lg me-2"></i> Pilih dari Galeri</button>' +
        '</div>' +
        '<img id="flowPreview_' + qid + '" class="image-preview img-fluid shadow-sm" style="display:none" alt="Preview">' +
        '<button id="fileSubmitBtn_' + qid + '" class="btn btn-submit-upload btn-lg-hp px-5 py-3 mt-3 shadow-sm w-100" onclick="flowFileAnswer(\'' + qid + '\')" disabled><i class="fas fa-upload me-2"></i> Lanjut</button>' +
        '</div>';
      break;
  }
  html += '</div>';
  container.innerHTML = html;
  requestAnimationFrame(function(){
    var prevBtn = document.getElementById('flowPrevBtn');
    if (prevBtn) prevBtn.disabled = (flowHistory.length === 0 || currentQuestion === 'start');
  });
}

function triggerGalleryOnly(qid) {

  if (prev && prev.dataset.bloburl) { URL.revokeObjectURL(prev.dataset.bloburl); prev.dataset.bloburl = ''; prev.src = ''; }
  setTimeout(function(){
    var fi = document.getElementById('flowFileInput_' + qid);
    if (fi) { fi.value = ''; fi.removeAttribute('capture'); fi.setAttribute('accept', 'image/*'); fi.click(); }
  }, 250);
