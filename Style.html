/* ====================================================================
   BAGIAN 2: STYLE DARI APLIKASI "MONITORING SEWA ATM/CRM"
   ==================================================================== */

/* ======================= CUSTOM MODAL FULL HEIGHT ======================= */
#customModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(15,23,42,.65);
  backdrop-filter: blur(6px);
  display: flex; justify-content: center; align-items: center;
  animation: modalFadeIn .25s ease;
  padding: 1rem;
}
.modal-box {
  background: #fff; border-radius: 16px; max-width: 680px; width: 100%;
  max-height: 92vh; height: auto;
  box-shadow: 0 25px 80px rgba(0,0,0,.35);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: modalSlideUp .3s cubic-bezier(.4,0,.2,1);
}
.modal-box.full-height { max-height: 92vh; height: 92vh; }
.modal-icon { text-align: center; font-size: 2.5rem; padding-top: 1.25rem; flex-shrink: 0; }
.modal-box h3 { text-align: center; margin: .5rem 0 0 0; padding: 0 1.5rem; color: #0f172a; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; flex-shrink: 0; }
.modal-body { padding: .5rem 1.5rem 1.5rem 1.5rem; overflow-y: auto; flex: 1; }
.modal-body.scrollable { flex: 1; overflow-y: auto; padding: .5rem 1.5rem 1.5rem 1.5rem; }
.modal-body p { margin: 0; color: #334155; font-size: 1rem; line-height: 1.7; white-space: pre-wrap; text-align: left; font-family: 'Segoe UI', system-ui, sans-serif; }
.modal-body p.center { text-align: center; }
.modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; display: flex; gap: .75rem; background: #fafbfc; flex-shrink: 0; border-radius: 0 0 16px 16px; }
.modal-footer button { flex: 1; padding: .75rem; border: none; border-radius: 8px; font-weight: 600; font-size: .95rem; cursor: pointer; transition: all .2s ease; }
.modal-footer button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.modal-footer button:active { transform: translateY(0); }
.modal-footer .btn-primary { background: #2563eb; color: #fff; }
.modal-footer .btn-primary:hover { background: #1d4ed8; }
.modal-footer .btn-danger { background: #dc2626; color: #fff; }
.modal-footer .btn-danger:hover { background: #b91c1c; }
.modal-footer .btn-secondary { background: #e2e8f0; color: #475569; }
.modal-footer .btn-secondary:hover { background: #cbd5e1; }
.modal-footer .btn-success { background: #16a34a; color: #fff; }
.modal-footer .btn-success:hover { background: #15803d; }
.modal-body::-webkit-scrollbar { width: 5px; }
.modal-body::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
.modal-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.modal-body::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
@keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalSlideUp {
  from { opacity: 0; transform: translateY(40px) scale(.96); }
  to   { opacity: 1; transform: translateY(0)   scale(1);   }
}
.modal-body table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.modal-body table td { padding: 6px 8px; }
.modal-body table tr:last-child td { border-bottom: none; }

/* ======================= TOMBOL UPDATE INDOMARET ======================= */
.btn-update-indomaret {
  background: #16a34a; color: #fff; border: none;
  padding: .6rem 1.5rem; border-radius: 8px;
  font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: .5rem;
  box-shadow: 0 2px 4px rgba(22,163,74,.3);

}

.btn-update-indomaret:active { transform: translateY(0); }

/* ======================= RESPONSIVE MODAL ======================= */
@media (max-width: 640px) {
  .modal-box { max-height: 95vh; height: 95vh; border-radius: 12px; }
  .modal-body { padding: .5rem 1rem 1rem 1rem; }

}

/* ====================================================================
   BAGIAN 3: APP SHELL, SIDEBAR & DASHBOARD 1 HALAMAN
   ==================================================================== */

#appShell {
  display: flex;
  height: 100vh;
  min-height: 100vh;
  width: 100%;
  background: #f8fafc;
  overflow: hidden;
}

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  box-shadow: 2px 0 8px rgba(0,0,0,.1);
}

.sidebar-header {
  padding: 1rem 1.25rem;
  font-size: 1.05rem;
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,.1);
  display: flex;
  align-items: center;
}

.sidebar-user {
  padding: .75rem 1.25rem;
  font-size: .85rem;
  color: #94a3b8;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebar-nav { padding: .5rem .5rem 2rem; flex: 1; }

.sidebar-link {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .55rem .85rem;
  margin: 2px 0;
  border-radius: 8px;
  color: #cbd5e1;
  text-decoration: none;
  font-size: .88rem;
  font-weight: 500;
  transition: all .15s;
  cursor: pointer;
}
.sidebar-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.sidebar-link.active { background: linear-gradient(90deg, #4f46e5, #7c3aed); color: #fff; box-shadow: 0 2px 8px rgba(79,70,229,.4); }
.sidebar-link i { width: 18px; text-align: center; }

.sidebar-group { margin-top: .5rem; }
.sidebar-group-title {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .55rem .85rem;
  font-size: .78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #94a3b8;
  cursor: pointer;
  border-radius: 8px;
  user-select: none;
}
.sidebar-group-title:hover { background: rgba(255,255,255,.05); color: #cbd5e1; }

/* ⬅ FIX: max-height hanya terbuka saat .open */
.sidebar-group-items,
.sidebar-subgroup-items {
  overflow: hidden;
  max-height: 0;
  transition: max-height .3s ease;
  padding-left: .5rem;
}
.sidebar-group-items.open,
.sidebar-subgroup-items.open { max-height: 900px; }

.sidebar-subgroup { margin-top: 2px; }
.sidebar-subgroup-title {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .5rem .85rem;
  font-size: .82rem;
  font-weight: 600;
  color: #94a3b8;
  cursor: pointer;
  border-radius: 8px;
}
.sidebar-subgroup-title:hover { background: rgba(255,255,255,.05); color: #cbd5e1; }

.group-arrow { transition: transform .25s; font-size: .75rem; }
.group-arrow.rotated { transform: rotate(180deg); }

.main-content {
  flex: 1;
  min-width: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1rem 1.5rem;
}

/* Dashboard mode: matikan scroll di main-content */
.main-content.dashboard-mode {
  overflow: hidden;
  padding: .5rem .75rem;
}

/* Landing page & survey (diluar appShell) */

  min-height: 100vh;
  padding: 1rem;
